si','amber'))+card('Tanya Chat AI','', '<div class="stack">'+btn('Kenapa kadar H₂O₂ F-03 turun lebih cepat?','chat','small')+btn('Bandingkan F-01 dan F-02 untuk ruang rawat','chat','small')+'</div>')+'</div></div><div class="mt">'+card('Aktivitas terbaru','', '<div class="activity">'+[['Hasil uji stabilitas F-01 (40°C, 5 hari) dicatat oleh Dewi','15 Okt 2026, 14:20'],['Model dilatih ulang ke versi v0.4 dengan 38 data eksperimen','14 Okt 2026, 09:00'],['F-04 (linalool, floral) dihentikan karena aroma berubah setelah 1 minggu','12 Okt 2026, 16:18'],['Ahli kimia tim menyetujui 3 kandidat untuk dibuat sampel','10 Okt 2026, 10:30']].map(([t,d],i)=>'<div><span class="dot" style="background:'+['#5831ed','#3173dd','#e5a51c','#177d42'][i]+'"></span>'+t+'<time>'+d+'</time></div>').join('')+'</div>')+'</div>'}
function ingredient(n,c,v,i){return '<div class="ingredient"><span class="num gray">'+i+'</span><div class="grow"><strong>'+n+'</strong><small>'+c+'</small></div><input class="dose" aria-label="Konsentrasi '+n+'" value="'+v+'" name="dose-'+i+'"><span class="muted tiny">% w/w</span><button type="button" class="delete" aria-label="Hapus '+n+'" onclick="this.closest(\'.ingredient\').remove()">×</button></div>'}

function formulation(){return head('Formulasi Baru','Masukkan bahan disinfektan, target aroma, parameter mutu, dan fasilitas lab untuk memulai analisis.','','dashboard')+'<form id="formula" onsubmit="event.preventDefault();storeDraft();go(\'screening\')"><div class="grid two" style="align-items:stretch"><section class="card"><div class="card-head"><div class="row"><span class="num">1</span><div><h2>Bahan Disinfektan</h2><p>Zat aktif, surfaktan, dan pelarut beserta konsentrasinya</p></div></div><button type="button" class="small" onclick="pickLibrary()">Pilih dari Library</button></div><div id="ingredients">'+ingredient('Hydrogen Peroxide','CAS 7722–84–1 · zat aktif','3.0',1)+ingredient('Alcohol Ethoxylate C12–14 (S-01)','CAS 68439–50–9 · surfaktan nonionik','2.0',2)+ingredient('Water (Aqua)','CAS 7732–18–5 · pelarut','ad 100',3)+'</div><button class="wide soft" type="button" onclick="addIngredient(\'ingredients\')">+ Tambah Bahan Disinfektan</button><p class="muted tiny mt">3 bahan · total terhitung 5% + pelarut ad 100</p></section><section class="card"><span class="num mb">2</span><h2>Target Aroma (Parfum)</h2><p class="muted tiny">Aroma berfungsi sebagai penanda ruangan sudah disemprot dan menutupi bau zat aktif</p><p class="tiny mt">A. Preferensi aroma (boleh lebih dari satu)</p><div class="aromas">'+['Citrus','Floral','Fresh','Woody','Fruity','Herbal','Musky','Sweet'].map((t,i)=>'<button type="button" class="'+(i===0||i===2?'selected':'')+'" aria-pressed="'+(i===0||i===2)+'" onclick="this.classList.toggle(\'selected\');this.setAttribute(\'aria-pressed\',this.classList.contains(\'selected\'))"><span class="dot" style="background:'+['#e9a416','#e64d93','#25a16f','#925e35','#e54239','#518d3a','#aaa0bb','#c667d6'][i]+'"></span>'+t+'</button>').join('')+'</div><p class="tiny">B. Detail target</p><div class="form-grid">'+select('Intensitas aroma',['Sedang','Ringan','Kuat'],'intensity')+select('Karakter dominan',['Citrus segar','Floral lembut','Herbal segar','Woody'],'character')+select('Lama aroma tercium setelah disemprot',['15–30 menit (penanda ruangan)','5–15 menit','30–60 menit'],'duration')+'</div><label class="field">Deskripsi tambahan (opsional)<textarea name="description">Aroma lemon segar, tidak terlalu manis, cocok untuk ruang rawat. Tercium jelas saat disemprot lalu memudar, tidak meninggalkan bau menyengat.</textarea></label><p class="tiny">C. Kandidat parfum</p><div class="segmented wide"><button type="button" class="active" onclick="scenario(this,false)">Skenario A · Parfum sudah ada</button><button type="button" onclick="scenario(this,true)">Skenario B · Minta rekomendasi</button></div><div id="perfume-block"><div id="perfumes">'+ingredient('d-Limonene','CAS 5989–27–5','0.5',4)+'</div><button type="button" class="wide soft" onclick="addIngredient(\'perfumes\')">+ Tambah Bahan Parfum</button></div><p class="muted tiny mt">Jika parfum ini berisiko tinggi, sistem akan menyusun campuran pengganti di tahap rekomendasi.</p></section></div><section class="card mt"><div class="card-head"><div class="row"><span class="num">3</span><div><h2>Target Produk dan Parameter Mutu LKPI</h2><p>Menjadi ambang lulus saat menilai kandidat dan hasil uji. Nilai dalam kurung siku diisi dari standar mutu LKPI.</p></div></div></div><div class="stats">'+field('Konsentrasi H₂O₂ target (% w/w)','3.0','target','number')+field('Retensi H₂O₂ minimum setelah uji','[90] %','retention')+field('Rentang pH','[3.0 – 4.5]','ph-range')+select('Uji stabilitas',['Accelerated stability test 40°C','Suhu ruang 25°C'],'stability')+'</div><div class="grid two"><div><p class="tiny">Kriteria keamanan ruangan medis</p>'+checks(['Tidak meninggalkan residu berbahaya di permukaan','Risiko iritasi pernapasan rendah saat disemprot','Alergen parfum mengikuti batas IFRA dan wajib label'])+'</div><div><p class="tiny">Strategi perlindungan aroma yang boleh dipakai</p>'+checks(['Solubilizer / surfaktan pelindung','Ko-solven dan penstabil (chelating agent)','Enkapsulasi (mis. siklodekstrin)','Rekonstruksi aroma dengan senyawa lebih tahan oksidasi'])+'</div></div></section><section class="card mt"><div class="card-head"><div class="row"><span class="num">4</span><div><h2>Alat dan Fasilitas Laboratorium</h2><p>Agar rekomendasi metode uji sesuai kemampuan lab</p></div></div><button type="button" class="primary small" onclick="addEquipment()">+ Tambah Alat</button></div><div id="equipment">'+table(['No.','Alat / metode uji','Kemampuan','Ketersediaan','Lokasi','Aksi'],[['pH meter','Mengukur pH','Tersedia'],['Titrasi permanganometri / iodometri','Kadar H₂O₂','Tersedia'],['UV–Vis spectrophotometer','Kejernihan / absorbansi','Perlu dijadwalkan'],['Climatic chamber 40°C / 75% RH','Accelerated stability test','Tersedia'],['GC–MS','Produk degradasi parfum','Eksternal']].map(([n,d,s],i)=>[i+1,'<strong>'+n+'</strong>',d,badge(s,s==='Tersedia'?'green':s==='Eksternal'?'':'amber'),i===4?'Lab mitra':'Internal','<button type="button" class="delete" aria-label="Hapus alat" onclick="this.closest(\'tr\').remove()">×</button>']))+'</div><p class="muted tiny mt">5 alat terdaftar · 3 siap dipakai</p></section><section class="card mt"><div class="card-head"><div class="row"><span class="num">5</span><div><h2>Data Internal (opsional)</h2><p>SDS bahan, spesifikasi produk, atau catatan formulasi sebelumnya</p></div></div></div><div class="dash tiny muted"><input id="attachments" type="file" accept=".pdf,.csv,.xlsx" multiple onchange="fileSelected(this)"><div id="file-label" class="mt">PDF, Excel, CSV (maks. 10 MB) · berkas dipilih secara lokal, belum dikirim ke server</div></div></section><div class="foot"><button type="button" onclick="state.draft={};save();render();toast(\'Formulir direset\')">Reset formulir</button><button class="primary">Lanjutkan ke Analisis →</button></div></form>'}
function scenario(b,v){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#perfume-block').classList.toggle('hidden',v)}
function storeDraft(){document.querySelectorAll('#formula [name]').forEach(el=>state.draft[el.name]=el.value);state.draft.ingredientRows=[...document.querySelectorAll('#ingredients .ingredient')].map(el=>({name:el.querySelector('strong')?.textContent||el.querySelector('input').value,description:el.querySelector('small')?.textContent||'Input lokal',value:el.querySelector('.dose').value}));state.draft.aromas=[...document.querySelectorAll('.aromas .selected')].map(el=>el.textContent.trim());save()}

function literature(){return head('Analisis Literatur (R-01)','Tinjau bukti ilmiah yang ditelusuri LLM + RAG untuk aturan yang terdeteksi.','','screening')+'<section class="card mb"><div class="row between"><div class="row"><span class="num gray" style="width:58px;border-radius:25px">R-01</span><div><strong>Ikatan rangkap C=C (alkene) pada d-Limonene</strong><div class="tiny muted">Pola SMARTS <code>[CX3]=[CX3]</code></div></div>'+badge('Risiko tinggi','red')+'</div>'+btn('Kembali ke daftar','screening','small')+'</div></section><div class="grid two"><div class="stack">'+card('Ringkasan analisis LLM','', '<div class="note red"><strong>⚠ Kesimpulan utama.</strong> Ikatan rangkap C=C pada limonene dapat dioksidasi H₂O₂ menjadi limonene oxide, serta mengalami oksidasi alilik menjadi carveol dan carvone. Akibatnya aroma citrus melemah atau berubah, dan sebagian H₂O₂ ikut terpakai.</div><p class="tiny mt">Detail temuan</p><ul class="tiny" style="padding-left:18px;line-height:1.8"><li>Laju oksidasi meningkat pada pH netral sampai basa dan pada suhu penyimpanan yang lebih tinggi.</li><li>Logam jejak dari bahan atau kemasan mempercepat penguraian H₂O₂ dan pembentukan radikal.</li><li>Jenis surfaktan dapat memperlambat atau mempercepat oksidasi.</li><li>Produk oksidasi limonene termasuk sensitizer kulit, sehingga relevan untuk keamanan pengguna.</li></ul>'+badge('Contoh ringkasan bersumber','green')+' '+badge('Ditinjau ahli kimia: belum',''),badge('Berdasarkan 7 sumber'))+card('Sumber ilmiah yang digunakan','Judul di bawah adalah contoh tampilan. Pada sistem nyata, daftar ini diisi otomatis dari hasil penelusuran RAG.', ['Kinetika oksidasi limonene oleh H₂O₂ dan produknya','Reaksi alkena dan terpena dengan peroksida','Stabilitas terpena dalam lingkungan pengoksidasi','Paten formulasi H₂O₂ beraroma yang stabil','Pengaruh logam jejak pada penguraian H₂O₂','Pengaruh surfaktan pada oksidasi parfum','Sensitisasi kulit oleh produk oksidasi limonene'].map((t,i)=>'<div class="list-i mendasi','primary wide')+'</div></div>'}

function trialTable(rows){return table(['Formulasi','Aroma','Dibuat','Diperbarui','Status','Progres','Hasil','Aksi'],rows.map(r=>{const last=state.results.filter(x=>x.candidate===r[0]&&!x.draft).at(-1);return ['<strong>'+r[0]+'</strong><p>'+r[1]+'</p>',badge(r[2]),r[3],last?esc(last.date):r[4],badge(r[5],statusColor(r[5])),progress(r[6],r[5]==='Sedang berjalan'?'#3173dd':r[5]==='Menunggu hasil'?'#e4a51c':r[5]==='Dihentikan'?'#da424a':'#21904e')+'<div class="tiny muted mt">'+r[6]/25+' / 4</div>',last?'Retensi '+last.retention.toFixed(1)+'% · '+esc(last.outcome):r[7],'<button class="small" onclick="activeCandidate=\''+r[0]+'\';go(\'input\')">'+(r[6]<100&&r[5]!=='Dihentikan'?'Input hasil':'Lihat detail')+'</button>']}))}
function filterTrials(){const q=$('#trial-search').value.toLowerCase(),selected=$('#trial-project').value==='Kandidat dipilih';let rows=trials.filter(r=>(trialFilter==='Semua'||r[5].startsWith(trialFilter))&&(!selected||state.selected.includes(r[0]))&&r.join(' ').toLowerCase().includes(q));if($('#trial-sort').value==='Kode formulasi')rows.sort((a,b)=>a[0].localeCompare(b[0]));$('#trial-table').innerHTML=rows.length?trialTable(rows):'<p class="muted" style="padding:28px;text-align:center">Tidak ada uji coba yang sesuai.</p>';$('#trial-count').textContent='Menampilkan '+rows.length+' dari '+trials.length+' formulasi'}

let experimentData={initial:'3.00',final:'2.91',phInitial:'3.6',phFinal:'3.7',clarity:'Jernih',notes:'',date:'2026-10-15',temperature:'40°C (dipercepat)',days:'5 hari'};

+'</div>';

if(experimentTab==='Uji antimikroba')return '<div class="note amber">Catat hasil pengujian laboratorium. Aroma bukan bukti efikasi antimikroba.</div><label class="field mt">Metode uji<input data-exp="method" placeholder="Metode sesuai standar LKPI" value="'+esc(experimentData.method||'')+'"></label><label class="field">Hasil dan organisme uji<textarea data-exp="microbe">'+esc(experimentData.microbe||'')+'</textarea></label>';
return '<label class="field">Catatan eksperimen<textarea data-exp="notes" style="min-height:200px">'+esc(experimentData.notes)+'</textarea></label>'}
function retentionValue(){const a=Number(experimentData.initial),b=Number(experimentData.final);return a>0&&Number.isFinite(b)?b/a*100:0}
function calcRetention(){captureExperiment();const r=retentionValue();$('#retention-result').textContent=Number(experimentData.initial)>0?r.toFixed(1)+'%'+(r>=90?' ✓':''):'Kadar awal harus > 0';$('#retention-result').parentElement.style.background=r>=90?'#e5f5ec':'#fff3dc'}
function switchExperiment(t){captureExperiment();experimentTab=t;$('#experiment-tabs').innerHTML=experimentTabs();$('#experiment-fields').innerHTML=experimentFields()}
function experimentTabs(){return ['Stabilitas kimia','Profil aroma','Karakteristik fisik','Uji antimikroba','Catatan'].map(t=>'<button class="'+(t===experimentTab?'active':'')+'" onclick="switchExperiment(\''+t+'\')">'+t+'</button>').join('')}
function experiment(){return head('Input Hasil Eksperimen','Catat hasil uji lab untuk kandidat terpilih. Data ini memperbarui evaluasi dan menjadi data latih model.','','evaluasi')+'<div class="grid mb experiment-summary" style="grid-template-columns:1fr 1.65fr 1fr"><section class="card" style="height:100%;background:#faf8ff"><p class="tiny">Kandidat yang dipilih</p><div class="row"><span class="value" style="font-size:36px">'+activeCandidate+'</span>'+badge('Terkunci')+'</div><p class="muted tiny">'+(trials.find(r=>r[0]===activeCandidate)?.[1]||candidates[0][1])+'. Komposisi dikunci agar hasil uji dapat dibandingkan antar iterasi.</p>'+badge('Tahap 3 dari 4 · accelerated stability','blue')+'</section>'+card('Komposisi formula','Rentang rekomendasi vs nilai sampel',table(['Bahan','Rentang (% w/w)','Nilai sampel'],comp(activeCandidate).map((r,i)=>[r[0],r[1],['3,0','2,0','0,4','0,1','pH 3,6','ad 100'][i]])))+card('Profil target','',radar(),badge('Citrus segar','amber'))+'</div><div class="grid split"><div>'+card('Input hasil uji coba','Hasil laboratorium untuk kandidat '+activeCandidate,'<div id="experiment-tabs" class="tabs">'+experimentTabs()+'</div><div id="experiment-fields">'+experimentFields()+'</div><button class="wide soft" onclick="extraParameter()">+ Tambah parameter kimia lain</button>','<label class="tiny">Tanggal uji <input id="test-date" type="date" value="'+esc(experimentData.date)+'"></label>')+'</div><aside class="stack">'+card('Panduan pengisian','','<p class="tiny">Gunakan metode uji yang konsisten dengan SOP lab LKPI.</p><p class="tiny">Catat kondisi penyimpanan (25°C, 40°C, atau uji dipercepat).</p><p class="tiny">Hasil gagal tetap dicatat, karena berguna sebagai data latih.</p>')+card('Kondisi penyimpanan','','<div id="conditions" class="form-grid"><label class="field">Suhu<select data-exp="temperature"><option>40°C (dipercepat)</option><option>25°C (suhu ruang)</option></select></label><label class="field">Lama simpan<select data-exp="days"><option>5 hari</option><option>2 hari</option><option>7 hari</option><option>14 hari</option></select></label>'+select('Kemasan',['Botol HDPE','Botol PET','Kaca'])+select('Paparan cahaya',['Tertutup','Terpapar cahaya'])+'</div>')+card('Riwayat hasil '+activeCandidate,'',table(['Tanggal','Kondisi','H₂O₂','pH','Status'],[...state.results.filter(x=>x.candidate===activeCandidate).map(x=>[esc(x.date),esc(x.temperature)+', '+esc(x.days),esc(x.final),esc(x.phFinal),badge(x.draft?'Draf':x.outcome,x.draft?'':x.retention>=90?'green':'amber')]),['15 Okt','40°C, 5 hari','2,91','3,7',badge('OK','green')],['12 Okt','40°C, 2 hari','2,97','3,6',badge('OK','green')],['10 Okt','Awal','3,00','3,6',badge('OK','green')]]))+card('Gunakan untuk pembelajaran model','','<label class="check"><input id="use-training" type="checkbox" checked> Tambahkan hasil ini ke dataset latih</label><p class="muted tiny">Akan menjadi data ke-'+(39+state.results.filter(x=>!x.draft).length)+'. Model dilatih ulang otomatis setiap 10 data baru pada sistem nyata.</p>'+btn('Lihat learning curve','model','wide small'))+'</aside></div><div class="foot"><button onclick="saveExperiment(true)">Simpan sebagai draf</button><button class="primary" onclick="saveExperiment(false)">Simpan dan perbarui evaluasi →</button></div>'}
function extraParameter(){modal('Parameter tambahan','<form onsubmit="event.preventDefault();experimentData.extra=$(\'#extra-name\').value+\': \'+$(\'#extra-value\').value;$(\'#modal\').close();toast(\'Parameter ditambahkan. Simpan hasil untuk menyimpan ke browser.\')">'+field('Nama parameter','','extra-name')+field('Nilai dan satuan','','extra-value')+'<button class="primary">Tambahkan</button></form>')}
function saveExperiment(draft){captureExperiment();const a=Number(experimentData.initial),b=Number(experimentData.final);if(!(a>0&&a<=100&&b>=0&&b<=100)){toast('Kadar awal harus lebih dari 0 dan kadar berada pada 0–100%.');return}if(![experimentData.phInitial,experimentData.phFinal].every(v=>Number.isFinite(Number(v))&&Number(v)>=0&&Number(v)<=14)){toast('pH harus berada pada rentang 0 sampai 14.');return}if(!experimentData.date){toast('Isi tanggal uji.');return}const r=retentionValue(),outcome=experimentData.clarity!=='Jernih'||r<80?'Tidak lolos':r>=90?'Sementara memenuhi':'Perlu tinjauan';state.results.push({...experimentData,candidate:activeCandidate,retention:r,outcome,draft,training:$('#use-training').checked&&!draft});save();toast(draft?'Draf tersimpan di browser.':'Hasil uji tersimpan dan evaluasi diperbarui.');if(!draft)go('evaluasi')}
function learning(){return head('Pembelajaran Model','Model dilatih ulang dari hasil uji yang dicatat formulator, termasuk yang gagal. Galat prediksi diharapkan menurun seiring bertambahnya data.','<button class="primary" onclick="trainDemo()">Latih ulang sekarang</button>')+'<div class="segmented">'+btn('Daftar uji coba','evaluasi')+btn('Pembelajaran model','model','active')+'</div>'+stats([[(38+state.results.filter(x=>x.training).length)+' / 60'+progress(Math.min(100,(38+state.results.filter(x=>x.training).length)/60*100),'',true),'Minimum untuk mode prediksi: [60] data'],[state.version,'Versi model aktif · Dilatih 14 Okt 2026'],['2 data lagi','Latih ulang berikutnya · otomatis setiap 10 data baru'],[badge('Mode evaluasi','amber'),'Prediksi ditampilkan sebagai pendukung, bukan keputusan']])+'<div class="grid split"><div class="stack">'+card('Learning curve','Galat validasi silang terhadap jumlah data eksperimen','<div id="learning-chart">'+curve(true)+'</div><div class="note amber mt">Kurva ini ilustrasi tampilan. Nilai galat nyata muncul setelah data eksperimen LKPI tersedia, dan target akurasi ditetapkan setelah data memadai.</div>','<div class="segmented"><button class="active" onclick="modelChart(this,0)">CatBoost</button><button onclick="modelChart(this,1)">XGBoost</button></div>')+card('Riwayat pelatihan ulang','',table(['Versi','Tanggal','Data latih','Galat vs versi sebelumnya','Catatan'],[['v0.4','14 Okt 2026','38',badge('↓ turun','green'),'Ditambah hasil F-04 dan F-05 yang gagal'],['v0.3','8 Okt 2026','28',badge('↓ turun','green'),'Data deskriptor bau Pyrfume ditambahkan'],['v0.2','1 Okt 2026','18',badge('≈ sama',''),'Data literatur dan SDS'],['v0.1','24 Sep 2026','10',badge('baseline',''),'Model awal']])+'<p class="tiny mt">Faktor paling berpengaruh pada prediksi retensi H₂O₂ (ilustrasi)</p>'+['pH formula','Chelating agent (HEDP)','Jumlah C=C pada parfum','Jenis surfaktan','Suhu penyimpanan'].map((t,i)=>'<div class="row tiny" style="margin:10px 0"><span style="width:200px">'+t+'</span><div class="grow">'+progress([88,70,62,40,35][i])+'</div></div>').join(''))+'</div><aside class="stack">'+card('Model dalam sistem','',[['MolFormer','Representasi struktur molekul (embedding). Model pralatih, tidak dilatih ulang.','Aktif'],['CatBoost','Prediksi retensi H₂O₂ setelah penyimpanan.','Evaluasi'],['XGBoost','Prediksi stabilitas fisik dan ketahanan aroma.','Evaluasi'],['Bayesian Optimization','Mengusulkan komposisi uji berikutnya yang paling informatif.','Aktif']].map(([n,d,s])=>'<div class="list-item"><span class="num">'+n[0]+'</span><div class="grow"><strong>'+n+'</strong><p>'+d+'</p></div>'+badge(s,s==='Aktif'?'green':'amber')+'</div>').join(''))+card('Usulan uji berikutnya','',table(['Bahan','Nilai'],[['Hydrogen Peroxide','3,0 %'],['Alcohol Ethoxylate (S-01)','1,8 %'],['Campuran aroma rekonstruksi','0,45 %'],['HEDP','0,15 %'],['pH target','3,9']])+'<p class="muted tiny"><strong>Alasan:</strong> wilayah pH 3,8–4,0 dengan dosis aroma lebih tinggi belum pernah diuji, sehingga hasilnya paling banyak menambah informasi bagi model.</p><button class="primary wide" onclick="newTrial()">Jadikan kandidat uji</button>'+btn('Diskusikan di Chat AI','chat','wide mt'),badge('Bayesian Optimization'))+'</aside></div>'}

const chemistryCatalog=[

{name:'Dihydromyrcenol',cas:'18479-58-8',aliases:[],groups:['alkene','tertiary'],sources:['S5'],family:'Alkohol tersier · C=C terminal'},
{name:'Tetrahydrolinalool',cas:'78-69-3',aliases:[],groups:['tertiary'],sources:['S6'],family:'Alkohol tersier jenuh'},
{name:'α-Methylbenzyl acetate',cas:'93-92-5',aliases:['methylbenzyl acetate','alpha methylbenzyl acetate','1-phenylethyl acetate'],groups:['ester'],sources:['S7'],family:'Ester aromatik'},
{name:'Hydrogen Peroxide',cas:'7722-84-1',aliases:['h2o2','hidrogen peroksida'],groups:['peroxide'],sources:['S3'],family:'Oksidator'},

];
const chemicalRules=[
{id:'R-01',group:'alkene',label:'Ikatan C=C alifatik',pattern:'[CX3]=[CX3]',risk:'Tinggi',reason:'Jalur oksidasi atau epoksidasi perlu diuji; katalis, medium, suhu, dan waktu memengaruhi hasil.',sources:['S1','S2']},

function knowledgeResults(){return state.knowledge.names.map(evaluateChemical)}
function knowledge(){const rows=knowledgeResults(),high=rows.filter(x=>x.risk==='Tinggi').length,unknown=rows.filter(x=>!x.compound).length;return head('Hasil Screening dan Analisis','Knowledge Screening · Analisis berbasis katalog struktur terkurasi dan aturan yang dapat ditelusuri.','<button onclick="exportScreening()">Ekspor hasil JSON</button>','formulasi')+'<div class="module-tabs segmented">'+btn('Screening bahan','screening','active')+btn('Literatur & sumber','literatur')+btn('Substitusi aroma','aroma')+'</div>'+stats([[rows.length,'Bahan yang ditinjau','flask'],[high,'Prioritas peninjauan tinggi','warning'],[unknown,'Identitas belum dipetakan','network'],[chemicalRules.length,'Aturan katalog aktif','file']])+'<div class="grid split"><div class="stack">'+card('Bahan dan konteks formulasi','Pilih nama/CAS dari katalog atau uji nama lain. Bahan yang tidak dikenal tidak diberi skor aman.','<form onsubmit="event.preventDefault();addScreeningCompound()" class="row"><input list="chemical-options" id="screen-compound" placeholder="Nama senyawa atau CAS..." aria-label="Bahan untuk screening" required><datalist id="chemical-options">'+chemistryCatalog.map(x=>'<option value="'+esc(x.name)+'">'+x.cas+'</option>').join('')+'</datalist><button class="primary">+ Tambah</button></form><div class="tabs">'+state.knowledge.names.map((n,i)=>'<button onclick="removeScreeningCompound('+i+')" aria-label="Hapus '+esc(n)+'">'+esc(n)+' ×</button>').join('')+'</div><div class="form-grid">'+field('Kadar awal H₂O₂ (% w/w)',state.knowledge.concentration,'screen-concentration','number')+field('pH awal',state.knowledge.ph,'screen-ph','number')+'</div><button class="primary wide" onclick="runKnowledge()">Jalankan screening aturan</button><p class="muted tiny">Nama bahan dipetakan ke gugus yang dikurasi. Tidak ada eksekusi SMARTS/RDKit atau pencarian web otomatis. Nilai pH dan kadar disimpan sebagai konteks; belum mengubah tingkat risiko.</p>')+card('Hasil penapisan yang dapat ditelusuri','Prioritas struktural, bukan prediksi hasil laboratorium.',table(['Bahan','Gugus / kelas','Aturan','Prioritas','Alasan'],rows.map(x=>['<strong>'+esc(x.name)+'</strong><p>'+esc(x.compound?.cas||'CAS belum diverifikasi')+'</p>',esc(x.compound?.family||'Tidak dikenal'),x.rules.map(r=>badge(r.id,'')).join(' ')||'—',badge(x.risk,x.risk==='Tinggi'?'red':x.risk==='Sedang'?'amber':''),esc(x.reason)])))+card('Jejak keputusan aturan','Pola SMARTS adalah dokumentasi untuk integrasi RDKit berikutnya.',rows.flatMap(x=>x.rules.map(r=>'<div class="list-item"><div class="grow"><strong>'+r.id+' · '+esc(x.name)+'</strong><p>'+r.label+' · <code>'+esc(r.pattern)+'</code></p><p>'+r.reason+'</p><div>'+r.sources.map(sourceLink).join(' ')+'</div></div></div>')).join('')||'<p class="muted">Belum ada aturan terpicu. Tetap perlukan pemeriksaan kimia dan uji stabilitas.</p>')+'</div><aside class="stack">'+card('Ringkasan dampak','Hipotesis yang perlu diuji','<p>Perubahan struktur parfum dapat mengubah profil bau. Oksidasi parfum dapat memakai oksidator; penguraian H₂O₂ juga dapat terjadi melalui jalur lain.</p><p class="muted tiny">Besar kehilangan kadar, aroma akhir, serta laju reaksi tidak dapat dihitung dari gugus fungsi saja.</p>'+sourceLink('S1')+' '+sourceLink('S2'))+card('Langkah berikutnya','','<div class="stack">'+btn('Tinjau mekanisme & literatur','literatur','primary')+btn('Cari substitusi aroma','aroma')+btn('Catat verifikasi eksperimen','evaluasi')+'</div>')+'<div class="note">Hasil belum merupakan keputusan formulasi. Gunakan sumber, SDS/IFRA yang relevan, serta verifikasi ahli dan laboratorium.</div></aside></div>'}
function addScreeningCompound(){const n=$('#screen-compound').value.trim();if(!n)return;if(state.knowledge.names.some(x=>normalizeChemical(x)===normalizeChemical(n))){toast('Bahan sudah ada.');return}state.knowledge.names.push(n);save();render()}
function removeScreeningCompound(i){state.knowledge.names.splice(i,1);save();render()}
function runKnowledge(){const c=Number($('#screen-concentration').value),p=Number($('#screen-ph').value);if(!Number.isFinite(c)||c<=0||c>100||!Number.isFinite(p)||p<0||p>14){toast('Isi kadar > 0 sampai 100% dan pH 0–14.');return}state.knowledge.concentration=c;state.knowledge.ph=p;state.knowledge.updated=new Date().toISOString();save();render();toast('Screening katalog selesai. Hasil diperbarui dari bahan yang dipilih.')}
function downloadLocal(name,text,type='text/plain;charset=utf-8'){const blob=new Blob([text],{type}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportScreening(){downloadLocal('BAYLab-screening.json',JSON.stringify({mode:'curated-catalog-rules',context:state.knowledge,results:knowledgeResults(),sources:evidenceSources,limitations:'Not RDKit, not an experimental stability prediction.'},null,2),'application/json')}
function evidenceView(){return head('Analisis Literatur','Pustaka terkurasi dengan sumber primer, konteks studi, dan batas penerapan pada formula LKPI.','<button onclick="downloadSources()">Ekspor daftar sumber</button>','screening')+'<div class="grid two"><div class="stack">'+card('Mekanisme yang perlu dibedakan','Contoh utama: d-Limonene dalam lingkungan oksidatif.','<div class="note"><strong>Jalur yang mungkin, bukan produk yang pasti.</strong> Penelitian berkatalis melaporkan epoksida, diol, carveol, carvone, dan produk lain. Profil produk bergantung kondisi.</div><div class="reaction-flow mt"><div class="list-item"><span class="num">1</span><div><strong>Epoksidasi C=C</strong><p>Alkena + H₂O₂ → epoksida + H₂O (skematik; memerlukan kondisi reaksi yang sesuai).</p></div></div><div class="list-item"><span class="num">2</span><div><strong>Pembukaan epoksida</strong><p>Epoksida dapat mengalami pembukaan cincin menuju diol pada kondisi tertentu.</p></div></div><div class="list-item"><span class="num">3</span><div><strong>Oksidasi alilik</strong><p>Carveol dan carvone merupakan contoh produk yang dilaporkan dalam sistem penelitian.</p></div></div></div><div class="mt">'+sourceLink('S1')+' '+sourceLink('S2')+'</div>')+card('Dampak pada formula','Hipotesis untuk desain eksperimen.','<ul class="evidence-list"><li>Perubahan senyawa volatil dapat menggeser karakter serta intensitas aroma.</li><li>Konsumsi oksidator oleh reaksi organik dapat memengaruhi kadar aktif; efek aktual harus diukur.</li><li>Variabel katalis/logam, pH, suhu, pelarut, dan waktu tidak boleh diabaikan saat membandingkan literatur.</li></ul><div class="note amber">Tidak ada klaim bahwa mencampur limonene dengan H₂O₂ pada suhu ruang akan menghasilkan distribusi produk yang sama dengan studi katalitik.</div>')+card('Strategi pencegahan yang dapat ditinjau','','<div class="list-item"><div><strong>Pengendalian logam dan stabilisasi</strong><p>Paten S3 menjelaskan pendekatan pengikat logam bersama penangkap radikal. Evaluasi kompatibilitas seluruh formula tetap diperlukan.</p>'+sourceLink('S3')+'</div></div><div class="list-item"><div><strong>Pemisahan fisik parfum</strong><p>Paten S4 membahas mikroenkapsulasi parfum dalam komposisi pemutih peroksigen. Ini merupakan pendekatan pembanding, bukan validasi kandidat LKPI.</p>'+sourceLink('S4')+'</div></div><div class="row mt">'+btn('Lihat aturan substitusi','aroma','primary')+btn('Diskusikan di Chat AI','chat')+'</div>')+'</div><aside>'+card('Sumber ilmiah dan paten','Diverifikasi saat pengembangan · 30 Oktober 2026. Pustaka ini tidak diperbarui otomatis.','<input id="source-search" placeholder="Cari judul, kata kunci, atau ID sumber..." aria-label="Cari sumber" oninput="filterSources()"><div id="source-list">'+evidenceSources.map(sourceCard).join('')+'</div>')+'</aside></div>'}
function filterSources(){const q=$('#source-search').value.toLowerCase(),xs=evidenceSources.filter(x=>[x.id,x.title,x.summary,x.type].join(' ').toLowerCase().includes(q));$('#source-list').innerHTML=xs.map(sourceCard).join('')||'<p class="muted">Sumber tidak ditemukan dalam pustaka lokal.</p>'}
function downloadSources(){downloadLocal('BAYLab-sumber.md',evidenceSources.map(x=>'## '+x.id+' · '+x.title+'\n\n'+x.url+'\n\n'+x.summary+'\n\nBatas bukti: '+x.limit).join('\n\n'))}
const substitutionOptions=[
{id:'saturated',title:'Alkohol tersier jenuh + ester',names:['Tetrahydrolinalool','α-Methylbenzyl acetate'],reason:'Menghindari aldehida dan C=C alifatik pada dua struktur yang dipilih. Ester tetap memerlukan evaluasi hidrolisis. Ini prioritas penapisan, bukan klaim tahan oksidasi.',sources:['S6','S7'],status:'Kandidat uji'},
{id:'fresh',title:'Alternatif fresh dengan peninjauan C=C',names:['Dihydromyrcenol','α-Methylbenzyl acetate'],reason:'Dihydromyrcenol masih memiliki C=C terminal. Status alkohol tersier tidak menghilangkan pemicu R-01; jangan diloloskan otomatis.',sources:['S5','S7'],status:'Perlu verifikasi tambahan'}
];
function substitution(){const original=evaluateChemical(subOriginal),opt=substitutionOptions.find(x=>x.id===subChoice)||substitutionOptions[0];return head('Rekonstruksi & Substitusi Aroma','Rule-based recommendation · Prioritaskan struktur alternatif dan uji kemiripan aroma.','<button onclick="exportSubstitutions()">Ekspor tabel aturan</button>','rekomendasi')+'<div class="note mb"><strong>Koreksi basis aturan.</strong> Decanal berkorespondensi dengan asam dekanoat; citral memiliki struktur berbeda. Jangan menyamakan produk oksidasi seluruh aldehida/terpena. '+sourceLink('S8')+' '+sourceLink('S9')+'</div><div class="grid split"><div class="stack">'+card('Pilih parfum awal','Aturan menjelaskan alasan pemilihan; tidak menghasilkan formula tervalidasi.','<label class="field">Senyawa asal<select id="sub-original" onchange="subOriginal=this.value;render()">'+['d-Limonene','Citral','Decanal','Linalool','Dihydromyrcenol'].map(n=>'<option '+(n===subOriginal?'selected':'')+'>'+n+'</option>').join('')+'</select></label><div class="row">'+badge(original.risk,'red')+'<span class="tiny">'+esc(original.compound?.family||'')+'</span></div><p class="muted tiny">Aturan terpicu: '+original.rules.map(x=>x.id).join(', ')+'</p>')+card('Pemetaan substitusi','Senyawa asal → risiko → alternatif → rasionalisasi struktur.',table(['Senyawa asal','Risiko oksidasi','Substitusi untuk diuji','Alasan kimiawi'],['d-Limonene','Citral','Decanal','Linalool'].map(n=>{const r=evaluateChemical(n);return ['<strong>'+n+'</strong>',r.rules.map(x=>x.label).join('; '),'Tetrahydrolinalool + α-methylbenzyl acetate','Alternatif jenuh/ester tanpa aldehida atau C=C alifatik yang dipetakan; kemiripan aroma dan stabilitas wajib diuji.']})))+card('Aturan seleksi kandidat','Urutan keputusan yang dapat diperiksa.',table(['Langkah','Logika'],[['1','Identitas tidak dikenal → tahan keputusan; minta struktur terverifikasi.'],['2','Aldehida atau C=C alifatik → prioritaskan tinjauan oksidasi.'],['3','Cari alternatif yang mengurangi gugus pemicu, bukan sekadar mengganti nama kelas.'],['4','Dihydromyrcenol → tetap ditandai R-01. Ester → evaluasi hidrolisis dan kelarutan.'],['5','Validasi SDS/IFRA, stabilitas kimia/fisik, panel aroma, dan efikasi sebelum keputusan formulasi.']]))+'</div><aside class="stack">'+card('Kandidat campuran konseptual','Belum ditetapkan dosis atau skor kemiripan.',substitutionOptions.map(x=>'<button class="wide '+(x.id===subChoice?'soft':'')+' mt" style="text-align:left" onclick="subChoice=\''+x.id+'\';render()">'+x.title+'<br><span class="tiny muted">'+x.names.join(' + ')+'</span></button>').join('')+'<div class="note mt">'+opt.reason+'</div><div class="mt">'+opt.sources.map(sourceLink).join(' ')+'</div>'+table(['Komponen','Status penapisan'],opt.names.map(n=>[n,badge(evaluateChemical(n).risk,evaluateChemical(n).risk==='Tinggi'?'red':'')]))+'<button class="primary wide mt" onclick="useSubstitution()">Gunakan sebagai usulan F-01</button><p class="muted tiny">Usulan hanya mengganti identitas campuran kandidat contoh. Rentang kadar dan skor lama tetap ilustratif; tidak dihitung dari struktur.</p>')+card('Validasi sebelum keputusan','','<div class="stack">'+['Retensi H₂O₂ dan produk degradasi','Kelarutan, kejernihan, dan pemisahan fase','Kemiripan dan penerimaan aroma oleh panel','Keamanan bahan serta efikasi antimikroba'].map(t=>'<div class="row tiny"><span class="num gray">✓</span>'+t+'</div>').join('')+'</div>'+btn('Rencanakan uji coba','evaluasi','wide mt'))+'</aside></div>'}
function useSubstitution(){const x=substitutionOptions.find(x=>x.id===subChoice);state.substitution={original:subOriginal,names:[...x.names],id:x.id,status:x.status};if(!state.selected.includes('F-01'))state.selected.push('F-01');activeCandidate='F-01';save();go('rekomendasi');toast('Usulan komponen F-01 diperbarui; perlu verifikasi lab.')}
function exportSubstitutions(){downloadLocal('BAYLab-aturan-substitusi.json',JSON.stringify({rules:chemicalRules,options:substitutionOptions,selected:state.substitution,validationRequired:true},null,2),'application/json')}


const syntheticColumns=['Experiment_ID','H2O2_Concentration_Pct','Final_H2O2_Concentration_Pct','Fragrance_Component','Chelating_Agent_Used','Surfactant_Type','Initial_pH','Final_pH','H2O2_Retention_Pct','Physical_Appearance','Status_Label','Data_Origin','Eligible_For_Training'];
function labelExperiment(retention,appearance){if(!Number.isFinite(retention))return 'Data tidak valid';if(retention<80-1e-9||appearance==='Keruh'||appearance==='Pemisahan Fase')return 'Gagal';if(retention>=90-1e-9&&appearance==='Jernih')return 'Lolos';return 'Perlu tinjauan'}
function generateSynthetic(){const initial=[15,16,17.5,18,19,20,21,22,24,25],ret=[96,78,89,90,79,94,80,91,92,88],looks=['Jernih','Jernih','Jernih','Jernih','Keruh','Jernih','Jernih','Pemisahan Fase','Keruh','Jernih'];return initial.map((v,i)=>({Experiment_ID:'SIM-'+String(i+1).padStart(3,'0'),H2O2_Concentration_Pct:v,Final_H2O2_Concentration_Pct:Number((v*ret[i]/100).toFixed(4)),Fragrance_Component:['d-limonene','dihydromyrcenol','linalool','tetrahydrolinalool','citral'][i%5],Chelating_Agent_Used:i%2?'Tetrasodium iminodisuccinate':'Asam sitrat',Surfactant_Type:i%2?'Nonionik':'Alkyl glucoside',Initial_pH:[3,3.2,3.4,3.5,3.7,3.8,4,4.1,4.3,4.4][i],Final_pH:[3.1,3.3,3.5,3.6,3.8,3.9,4.1,4.2,4.4,4.5][i],Physical_Appearance:looks[i],Data_Origin:'synthetic',Eligible_For_Training:false}))}
if(!Array.isArray(state.synthetic)||state.synthetic.length!==10)state.synthetic=generateSynthetic();
function computedSynthetic(){return state.synthetic.map(r=>{const ret=r.Final_H2O2_Concentration_Pct/r.H2O2_Concentration_Pct*100;return {...r,H2O2_Retention_Pct:Number(ret.toFixed(4)),Status_Label:labelExperiment(ret,r.Physical_Appearance),Data_Origin:'synthetic',Eligible_For_Training:false}})}
let datasetFilter='Semua';
function datasetTable(){const rows=computedSynthetic().filter(r=>datasetFilter==='Semua'||r.Status_Label===datasetFilter);return table(['Experiment ID','H₂O₂ awal (%)','H₂O₂ akhir (%)','Komponen parfum','Chelating agent','Surfaktan','pH awal → akhir','Retensi (%)','Tampilan fisik','Label'],rows.map(r=>{const i=state.synthetic.findIndex(x=>x.Experiment_ID===r.Experiment_ID);return ['<strong>'+r.Experiment_ID+'</strong><p>Sintetis · bukan data latih</p>',r.H2O2_Concentration_Pct,'<input class="dataset-number" aria-label="Kadar akhir '+r.Experiment_ID+'" type="number" min="0" max="'+r.H2O2_Concentration_Pct+'" step=".001" value="'+r.Final_H2O2_Concentration_Pct+'" onchange="editSynthetic('+i+',\'Final_H2O2_Concentration_Pct\',this.value)">',r.Fragrance_Component,r.Chelating_Agent_Used,r.Surfactant_Type,r.Initial_pH+' → '+r.Final_pH,r.H2O2_Retention_Pct.toFixed(2),'<select aria-label="Tampilan fisik '+r.Experiment_ID+'" onchange="editSynthetic('+i+',\'Physical_Appearance\',this.value)">'+['Jernih','Keruh','Pemisahan Fase'].map(x=>'<option '+(x===r.Physical_Appearance?'selected':'')+'>'+x+'</option>').join('')+'</select>',badge(r.Status_Label,r.Status_Label==='Lolos'?'green':r.Status_Label==='Gagal'?'red':'amber')]}))}
function dataset(){const rs=computedSynthetic();return head('Dataset Simulasi','Experiment Tracking · 10 baris sintetis untuk memeriksa logika MVP, ekspor, dan batas klasifikasi.','<button onclick="showDatasetMarkdown()">Tabel Markdown</button><button class="primary" onclick="exportSyntheticCSV()">↓ Ekspor CSV</button>','model')+'<div class="note amber mb"><strong>Data sintetis · tidak untuk pelatihan atau klaim akurasi.</strong> Rentang H₂O₂ 15–25% mengikuti skenario pengujian pada prompt; bukan rekomendasi konsentrasi disinfektan atau petunjuk pembuatan. Dataset terpisah dari hasil uji nyata dan tidak menambah hitungan data latih.</div>'+stats([[10,'Baris sintetis'],[rs.filter(r=>r.Status_Label==='Lolos').length,'Lolos aturan simulasi'],[rs.filter(r=>r.Status_Label==='Gagal').length,'Gagal aturan simulasi'],[rs.filter(r=>r.Status_Label==='Perlu tinjauan').length,'Perlu tinjauan']])+'<section class="card"><div class="card-head"><div><h2>Data eksperimen sintetis</h2><p>Ubah kadar akhir atau tampilan fisik untuk menguji perhitungan dan label.</p></div><button class="small" onclick="resetSynthetic()">Reset 10 contoh</button></div><div class="tabs">'+['Semua','Lolos','Gagal','Perlu tinjauan'].map(t=>'<button class="'+(datasetFilter===t?'active':'')+'" onclick="datasetFilter=\''+t+'\';render()">'+t+'</button>').join('')+'</div><div id="dataset-table">'+datasetTable()+'</div><p class="muted tiny">Ekspor selalu memuat seluruh 10 baris, termasuk kadar akhir, label, asal data, dan status kelayakan pelatihan.</p></section><div class="grid two mt">'+card('Aturan pelabelan','Ambang pengujian MVP; bukan standar produk tervalidasi.',table(['Kondisi','Status'],[['Retensi ≥ 90% dan jernih',badge('Lolos','green')],['Retensi < 80%, keruh, atau pemisahan fase',badge('Gagal','red')],['80% ≤ retensi < 90% dan jernih',badge('Perlu tinjauan','amber')]])) +card('Audit dataset','','<div class="note">Retensi = kadar akhir ÷ kadar awal × 100%.<br>Kolom <code>Final_H2O2_Concentration_Pct</code> ditambahkan agar hasil dapat dihitung ulang.</div><p class="tiny"><code>Data_Origin = synthetic</code><br><code>Eligible_For_Training = false</code></p><p class="muted tiny">Kekeruhan/pemisahan fase mengalahkan status retensi yang lolos. Variasi hasil tidak menunjukkan hubungan sebab-akibat antar bahan; nilainya dibuat untuk menguji perangkat lunak.</p>')+'</div>'}
function editSynthetic(i,key,value){const row=state.synthetic[i];if(key==='Final_H2O2_Concentration_Pct'){const n=Number(value);if(value===''||!Number.isFinite(n)||n<0||n>row.H2O2_Concentration_Pct){toast('Kadar akhir harus 0 sampai kadar awal untuk skenario sintetis ini.');$('#dataset-table').innerHTML=datasetTable();return}row[key]=n}else if(key==='Physical_Appearance'&&['Jernih','Keruh','Pemisahan Fase'].includes(value))row[key]=value;save();render()}
function resetSynthetic(){state.synthetic=generateSynthetic();save();datasetFilter='Semua';render();toast('10 baris contoh direset. Hasil uji nyata tidak diubah.')}
function csvCell(v){let t=String(v);if(/^[=+@]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'}
function syntheticCSV(){return '\uFEFF'+[syntheticColumns.map(csvCell).join(','),...computedSynthetic().map(r=>syntheticColumns.map(k=>csvCell(r[k])).join(','))].join('\r\n')}
function exportSyntheticCSV(){downloadLocal('BAYLab-dataset-sintetis.csv',syntheticCSV(),'text/csv;charset=utf-8')}
function datasetMarkdown(){return '| '+syntheticColumns.join(' | ')+' |\n| '+syntheticColumns.map(()=> '---').join(' | ')+' |\n'+computedSynthetic().map(r=>'| '+syntheticColumns.map(k=>String(r[k]).replace(/\|/g,'\\|')).join(' | ')+' |').join('\n')}
function showDatasetMarkdown(){modal('Tabel Markdown · 10 data sintetis','<p class="muted tiny">Pilih dan salin tabel, atau unduh berkas Markdown.</p><textarea id="dataset-markdown" readonly style="min-height:300px;font:11px monospace"></textarea><button class="primary mt" onclick="downloadLocal(\'BAYLab-dataset-sintetis.md\',datasetMarkdown())">Unduh Markdown</button>');$('#dataset-markdown').value=datasetMarkdown()}
const pitchSections=[
{label:'Hook',time:'0:00–0:25',text:'Bayangkan sebuah disinfektan yang pada hari pertama beraroma segar, tetapi setelah disimpan aromanya berubah, cairannya keruh, dan kadar zat aktifnya menurun. Bagi tim riset, ini bukan sekadar masalah wangi. Ini berarti mengulang eksperimen, menambah biaya, dan menunda produk sampai ke pengguna. Pertanyaannya: bisakah kita mengenali kandidat yang berisiko sebelum menghabiskan waktu di laboratorium?'},
{label:'Problem',time:'0:25–0:55',text:'Saya Muhammad Nafis Yusa’, Ketua Tim Side Quest UTS dari Universitas Indonesia. Melalui tantangan LKPI-01 bersama PT Likuid Pharmalab Indonesia, kami mengembangkan BAYLab AI. Tantangannya adalah merancang disinfektan hidrogen peroksida beraroma yang stabil. Oksidator dan komponen parfum dapat saling memengaruhi. Saat pemilihan bahan hanya bergantung pada coba-coba, setiap kegagalan baru terlihat setelah waktu, bahan, dan tenaga terpakai. Kami ingin membantu formulator memulai eksperimen dengan alasan yang lebih kuat.'},
{label:'Solution',time:'0:55–1:45',text:'BAYLab AI adalah perangkat lunak pendukung keputusan untuk menyatukan pengetahuan kimia dan data eksperimen. Alurnya dimulai dari bahan, target aroma, dan parameter mutu. PubChem dan RDKit direncanakan untuk membantu mengenali struktur serta gugus rentan. Penelusuran literatur berbasis RAG melengkapi penapisan dengan bukti yang bisa diperiksa. Berikutnya, aturan kompatibilitas membantu memprioritaskan kandidat dan mengusulkan rekonstruksi aroma. Formulator dapat melihat alasan setiap usulan, lalu mencatat hasil uji, termasuk kegagalan. Setelah data nyata memadai, CatBoost atau XGBoost dan optimasi Bayesian direncanakan untuk mendukung iterasi berikutnya. Pada demo ini, kami memperlihatkan alur antarmuka, aturan katalog, sumber terkurasi, dan pencatatan hasil. Integrasi serta validasi ilmiah menjadi tahap pengembangan berikutnya.'},
{label:'Market & business impact',time:'1:45–2:25',text:'Pengguna awal kami jelas: tim R&D LKPI yang mengembangkan produk bagi fasilitas pelayanan kesehatan. Nilai yang kami tawarkan adalah keputusan eksperimen yang lebih terarah dan hasil yang lebih mudah ditelusuri. Dalam proposal, kami menargetkan pengurangan biaya eksperimen sebesar 35 persen. Dari asumsi anggaran R&D Rp400 juta per tahun, potensi penghematannya Rp140 juta. Waktu pengembangan ditargetkan turun dari 12 menjadi 8 bulan. Angka-angka ini adalah target yang harus diuji bersama mitra, bukan hasil yang sudah kami capai. Keberhasilan akan dinilai dari eksperimen dan penghematan yang benar-benar terukur.'},
{label:'Team & closing',time:'2:25–3:00',text:'Sebagai tim Side Quest UTS, kami menyiapkan kolaborasi pengembangan perangkat lunak, data, dan penelaahan kimia bersama ahli serta formulator mitra. Target kesiapan teknologi dalam proposal adalah bergerak dari TKT 2 menuju TKT 4 pada Demo Day melalui pembuktian yang terdokumentasi. Kami mengajak LKPI menguji alur ini pada kasus dan data yang relevan, menyepakati kriteria keberhasilan, lalu mengevaluasinya bersama. BAYLab AI membantu setiap eksperimen menjadi sumber pengetahuan untuk keputusan berikutnya. Aroma bukan bukti efikasi; hasil laboratorium tetap menjadi penentu. Terima kasih.'}
];
let pitchRemaining=180,pitchStarted=0,pitchInterval=null;
function pitchPlain(){return pitchSections.map(x=>x.label+' ('+x.time+')\n'+x.text).join('\n\n')}
function pitchPage(){const count=pitchSections.map(x=>x.text).join(' ').trim().split(/\s+/).length;return head('Pitching Demo Day','Naskah 3 menit · Side Quest UTS · Tantangan LKPI-01 · UMS Health Innovation Hackathon 2026','<button onclick="downloadLocal(\'BAYLab-pitch-3-menit.md\',pitchPlain())">↓ Unduh naskah</button>')+stats([['35%','Target pengurangan biaya eksperimen'],['Rp140 juta','Potensi hemat/tahun dari asumsi Rp400 juta'],['12 → 8 bulan','Target waktu pengembangan'],['TKT 2 → 4','Target proposal pada Demo Day']])+'<div class="grid split"><div class="stack">'+pitchSections.map((x,i)=>card('<span class="num" style="margin-right:8px">'+(i+1)+'</span>'+x.label,x.time,'<p class="pitch-text">'+x.text+'</p>')).join('')+'</div><aside class="stack pitch-tools">'+card('Latihan presentasi','Pengatur waktu 3 menit.','<div id="pitch-timer" class="pitch-clock">'+formatPitchTime(pitchRemaining)+'</div><div class="row"><button id="pitch-start" class="primary grow" onclick="togglePitchTimer()">'+(pitchInterval?'Jeda':'Mulai')+'</button><button onclick="resetPitchTimer()">Reset</button></div><p class="muted tiny">'+count+' kata · estimasi '+(count/140).toFixed(1)+' menit pada 140 kata/menit. Sesuaikan jeda dan tempo saat latihan.</p>')+card('Alur demonstrasi','','<div class="stack">'+btn('1. Input & screening bahan','screening')+btn('2. Periksa bukti','literatur')+btn('3. Lihat usulan substitusi','aroma')+btn('4. Catat eksperimen','evaluasi')+btn('5. Uji logika dataset','dataset')+'</div>')+'<div class="note amber"><strong>Klaim terukur.</strong> Penghematan, percepatan, dan TKT ditulis sebagai target proposal. Presentasi tidak menyatakan bahwa AI, efikasi, ataupun manfaat finansial telah tervalidasi.</div></aside></div>'}
function formatPitchTime(t){return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function paintPitch(){if($('#pitch-timer'))$('#pitch-timer').textContent=formatPitchTime(pitchRemaining);if($('#pitch-start'))$('#pitch-start').textContent=pitchInterval?'Jeda':'Mulai'}
function togglePitchTimer(){if(pitchInterval){clearInterval(pitchInterval);pitchInterval=null}else{if(pitchRemaining<=0)pitchRemaining=180;pitchStarted=Date.now()+pitchRemaining*1000;pitchInterval=setInterval(()=>{pitchRemaining=Math.max(0,Math.ceil((pitchStarted-Date.now())/1000));if(!pitchRemaining){clearInterval(pitchInterval);pitchInterval=null;toast('Waktu latihan 3 menit selesai.')}paintPitch()},250)}paintPitch()}
function resetPitchTimer(){clearInterval(pitchInterval);pitchInterval=null;pitchRemaining=180;paintPitch()}
const baseRecommendation=views.rekomendasi,baseLearning=views.model,baseForm=views.formulasi,baseChat=views.chat,baseComp=comp,baseStoreDraft=storeDraft,baseMessageHTML=messageHTML,baseRender=render;
comp=function(id){const rows=baseComp(id).map(r=>[...r]);if(id==='F-01'&&state.substitution){rows[2][0]=state.substitution.names.join(' + ');rows[2][2]='Usulan aroma; belum diuji';}return rows};
storeDraft=function(){baseStoreDraft();const names=[...document.querySelectorAll('#perfumes .ingredient')].map(el=>el.querySelector('strong')?.textContent||el.querySelector('input')?.value).filter(Boolean);state.draft.perfumeRows=[...document.querySelectorAll('#perfumes .ingredient')].map(el=>({name:el.querySelector('strong')?.textContent||el.querySelector('input')?.value,description:el.querySelector('small')?.textContent||'Input lokal',value:el.querySelector('.dose')?.value||''}));state.knowledge.names=$('#perfume-block').classList.contains('hidden')?[]:names;state.knowledge.concentration=Number($('#target').value)||3;save()};
function integratedRecommendations(){const note=state.substitution?'<strong>Usulan F-01 diperbarui:</strong> '+esc(state.substitution.names.join(' + '))+'. Asal: '+esc(state.substitution.original)+'. Rentang komposisi dan skor di bawah tetap contoh, bukan hasil kalkulasi ilmiah.':'Pilih alternatif komponen melalui aturan substitusi. Skor kandidat di bawah merupakan contoh desain, belum dihitung oleh model.';return '<div class="note mb">'+note+' <a href="#aroma">Buka aturan substitusi →</a></div>'+baseRecommendation()}
function integratedLearning(){return '<div class="note mb"><strong>Pisahkan sumber data.</strong> Dataset sintetis digunakan untuk menguji alur perangkat lunak, tidak menambah data eksperimen atau melatih model. <a href="#dataset">Buka 10 data simulasi →</a></div>'+baseLearning()}
function integratedForm(){return baseForm().replace('<div id="perfumes">','<datalist id="perfume-options">'+chemistryCatalog.filter(x=>!['Hydrogen Peroxide','Water (Aqua)','HEDP'].includes(x.name)).map(x=>'<option value="'+esc(x.name)+'">').join('')+'</datalist><div id="perfumes">')}
const retrievalIndex=[
{keys:['limonene','epoks','carveol','carvone','oksidasi','degradasi'],ids:['S1','S2'],text:'Studi katalitik melaporkan epoksida, diol, dan produk oksidasi alilik limonene. Jenis dan jumlah produk bergantung kondisi; pustaka ini tidak menetapkan laju atau hasil untuk formula LKPI.'},
{keys:['dihydromyrcenol','dihidro'],ids:['S5'],text:'Dihydromyrcenol adalah alkohol tersier yang tetap mempunyai C=C terminal. Karena itu, aturan R-01 masih terpicu. Kelas alkohol tersier tidak cukup untuk menyimpulkan ketahanan oksidasi.'},
{keys:['tetrahydrolinalool','jenuh'],ids:['S6'],text:'Tetrahydrolinalool dipetakan sebagai alkohol tersier jenuh, tanpa aldehida atau C=C alifatik. Ini mengurangi dua pemicu katalog, tetapi tidak membuktikan stabilitas, keamanan, atau kemiripan aroma.'},
{keys:['methylbenzyl','ester'],ids:['S7'],text:'α-Methylbenzyl acetate dipetakan sebagai ester aromatik. Cincin aromatik tidak diperlakukan sebagai C=C alifatik. Hidrolisis, kelarutan, dan ketahanan aroma tetap perlu diuji.'},
{keys:['hedp','logam','chelating','stabilisasi'],ids:['S3','S4'],text:'Paten membahas pengikatan logam dan pendekatan stabilisasi komposisi peroksida. Bukti tersebut tidak langsung memvalidasi bahan, dosis, atau stabilitas formula LKPI.'},
{keys:['enkapsulasi','kapsul'],ids:['S4'],text:'Paten S4 membahas mikroenkapsulasi parfum dalam pemutih peroksigen. Teknologinya tidak otomatis setara dengan β-siklodekstrin atau aman untuk penyemprotan ruangan.'},
{keys:['decanal','dekanoat','citral','sitral'],ids:['S8','S9'],text:'Decanal berkorespondensi dengan asam dekanoat. Citral adalah aldehida tak jenuh dengan struktur berbeda; jangan menyamakan produk oksidasi kedua bahan.'}
];
function retrieveEvidence(q){const text=q.toLowerCase();return retrievalIndex.map(x=>({...x,score:x.keys.reduce((n,k)=>n+(text.includes(k)?1:0),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,2)}
messages=[{role:'ai',text:'Pustaka terkurasi BAYLab AI siap ditelusuri. Tanyakan tentang limonene, alkohol tersier, ester, stabilisasi, atau data uji. Jawaban mengambil catatan lokal dengan tautan sumber; bukan hasil model generatif atau pencarian RAG langsung.',sources:[]}];
messageHTML=function(){return messages.map(m=>'<div class="message '+m.role+'">'+(m.role==='ai'?'<div class="row tiny"><span class="avatar" style="width:28px;height:28px">AI</span><strong>BAYLab AI</strong>'+badge('Pustaka terkurasi','')+'</div><p>':'')+esc(m.text)+(m.role==='ai'?'</p><div class="tiny">'+(m.sources||[]).map(sourceLink).join(' ')+'</div>':'')+'</div>').join('')};
function integratedChat(){return baseChat().replace('Diskusikan hasil simulasi dan eksperimen. Jawaban merujuk data proyek dan literatur yang tersimpan (RAG).','Telusuri catatan ilmiah lokal dan konteks eksperimen, dengan rujukan yang dapat dibuka.').replace('Jawaban AI adalah contoh simulasi, bukan layanan AI terhubung. Keputusan formula tetap ditinjau formulator dan ahli kimia.','Penelusuran kata kunci pada pustaka terkurasi; belum menggunakan LLM/RAG. Keputusan formula tetap ditinjau formulator dan ahli kimia.').replace(/<aside class="stack">[\s\S]*?<\/aside><\/div>$/,'<aside class="stack">'+card('Konteks saat ini','','<p class="tiny">Bahan screening: '+esc(state.knowledge.names.join(', ')||'belum dipilih')+'</p><p class="tiny">'+state.results.filter(r=>!r.draft).length+' catatan eksperimen lokal.</p>'+btn('Buka screening','screening','wide small'))+card('Sumber jawaban terakhir','','<div id="chat-sources"><p class="muted tiny">Tautan muncul setelah pertanyaan cocok dengan pustaka.</p></div>')+'</aside></div>')}
askChat=function(q){q=q.trim();if(!q)return;let hits=retrieveEvidence(q),ids=[...new Set(hits.flatMap(x=>x.ids))],answer=hits.map(x=>x.text).join('\n\n');if(/rangkum|dataset|sintetis|retensi/i.test(q)){answer='Retensi dihitung sebagai kadar akhir ÷ kadar awal × 100%. Dataset simulasi memuat 10 baris sintetis dan tidak masuk data latih. Pada aturan MVP: ≥90% dan jernih = Lolos; <80%, keruh, atau pemisahan fase = Gagal; kondisi lainnya perlu tinjauan.\nCatatan eksperimen lokal: '+state.results.filter(r=>!r.draft).length+'.';ids=[]}else if(/bandingkan|F-01|F-02|F-03/i.test(q)){answer='Kandidat desain F-01 dan F-02 mempunyai skor contoh 0,84 dan 0,78; skor ini bukan prediksi tervalidasi. '+(state.substitution?'Usulan F-01 saat ini: '+state.substitution.names.join(' + ')+'.':'F-01 memakai konsep aroma rekonstruksi; F-02 memakai konsep enkapsulasi.')+'\nBandingkan dengan uji stabilitas, panel aroma, serta efikasi. '+(answer||'');}if(!answer)answer='Tidak ada catatan yang cocok dalam pustaka lokal. Coba sebutkan senyawa atau mekanisme, misalnya limonene, dihydromyrcenol, ester, atau chelating agent. Tidak ada sumber atau jawaban ilmiah yang dibuat untuk pertanyaan yang belum tercakup.';messages.push({role:'user',text:q},{role:'ai',text:answer,sources:ids});$('#messages').innerHTML=messageHTML();$('#chat-input').value='';if($('#chat-sources'))$('#chat-sources').innerHTML=ids.length?ids.map(id=>sourceCard(evidenceSources.find(x=>x.id===id))).join(''):'<p class="muted tiny">Jawaban dari aturan/data lokal, tanpa kutipan literatur tambahan.</p>';$('#messages').lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'})};
views.screening=knowledge;views.literatur=evidenceView;views.aroma=substitution;views.rekomendasi=integratedRecommendations;views.model=integratedLearning;views.formulasi=integratedForm;views.chat=integratedChat;views.dataset=dataset;views.pitch=pitchPage;
navs.push(['dataset','Dataset Simulasi','file'],['pitch','Pitching Demo Day','clipboard']);
const extraMaterials=[['Tetrahydrolinalool','Bahan aroma','78-69-3','Tidak ada C=C / aldehida terpetakan','Perlu analisis komponen','Belum diverifikasi','PubChem · S6'],['Citral','Bahan aroma','5392-40-5','C=C dan aldehida','Tinggi','Verifikasi SDS / IFRA','PubChem · S9'],['Decanal','Bahan aroma','112-31-2','Aldehida','Tinggi','Verifikasi SDS / IFRA','PubChem · S8']];
for(const m of extraMaterials)if(!materials.some(x=>x[2]===m[2]))materials.push(m);
render=function(){baseRender();if(route()==='formulasi'){if(state.draft.perfumeRows)$('#perfumes').innerHTML=state.draft.perfumeRows.map((x,i)=>ingredient(esc(x.name),esc(x.description),esc(x.value),i+4)).join('');document.querySelectorAll('#perfumes input:not(.dose)').forEach(el=>el.setAttribute('list','perfume-options'))}if(route()==='library'){const values=document.querySelectorAll('.stats .value');values[0].textContent=materials.length+state.materials.length;values[1].textContent=[...materials,...state.materials].filter(x=>x[4]==='Tinggi').length}if(route()==='pitch')paintPitch()};
window.addEventListener('hashchange',()=>{if(route()!=='pitch'&&pitchInterval){clearInterval(pitchInterval);pitchInterval=null}});
