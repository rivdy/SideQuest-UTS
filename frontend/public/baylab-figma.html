/* Figma alignment layer: tokens and component specs from the BAYLab AI · UI/UX file. */
:root{--p:#5232e0;--ink:#1d1b2e;--muted:#5e5a73;--line:#e7e5f2;--link:#4a2bd8}
body{font-size:13px;line-height:1.45}
a,button{color:var(--link)}.primary{color:#fff}.primary:hover{background:#4326c9}
.brand{font-weight:800;letter-spacing:-.5px}
.nav a{font-size:14px;line-height:20.3px}.nav a.active{background:#ece8fd;color:var(--link)}
.head h1{letter-spacing:-.5px;line-height:28.6px}.head p{font-size:13.5px;line-height:19.6px}
.card{border-radius:14px;padding:19px 20px}.card h2{font-size:17px;line-height:24.7px;letter-spacing:-.2px}.card-head p{font-size:12.5px;line-height:18.1px;color:var(--muted)}
.back{display:inline-flex;align-items:center;justify-content:center;background:#fff}
.num.gray{background:#ecebf2;color:#4c4860}.step.todo{background:#fbfafe}.step.todo strong{color:#2e2b40}
.step strong{line-height:18.9px}.step p{line-height:17.4px;font-size:12px;color:var(--muted)}
th{color:#4c4860;font-size:12.5px}td{font-size:12.5px;line-height:18.1px;color:#1d1b2e}
th,td{border-bottom-color:#f1f0f6;padding:11px 12px}.table-wrap{border-color:#eeecf5;border-radius:12px}
code,.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-weight:500;color:#b42318;font-size:12px;word-break:normal;overflow-wrap:anywhere}
.badge{font-weight:600;line-height:17.4px;padding:3px 10px}.badge.green{color:#0f6b3a}.badge.red{background:#fdecec;color:#b42318}.badge.amber{color:#8a4b00}.badge.blue{background:#e7f0fd;color:#1d56b3}.badge.purple{background:#ece8fd;color:var(--link)}
.rule-id{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-weight:500;font-size:12px;color:#1d1b2e}
tr.tint-red td{background:#fff7f7}tr.tint-amber td{background:#fffaf0}
.molecules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.molecule h3{font-size:14px;line-height:20.3px;margin:0 0 8px}.molecule.risk{border-color:#fad4d0}
.molecule svg{display:block;width:100%;height:110px;margin:4px 0 6px}.molecule svg text{stroke:none;font-family:'Plus Jakarta Sans',Arial,sans-serif;font-weight:700}
.molecule .meta{display:grid;grid-template-columns:96px minmax(0,1fr);gap:3px 0;font-size:12.5px;line-height:18.1px}.molecule .meta span:nth-child(odd){color:var(--muted)}
.tabs button{font-size:13px;font-weight:500;padding:8px 12px;border-radius:10px;color:#2e2b40;border-color:var(--line)}
.segmented{background:#f1f0f6}.segmented button{font-size:13px}
.run-meta{font-size:12.5px;color:var(--muted)}
.rules-table td:nth-child(1){width:48px}.rules-table td:nth-child(2){width:118px}.rules-table td:nth-child(3){width:124px}.rules-table td:nth-child(5){width:108px}.rules-table td:nth-child(7){width:58px}.rules-table td{padding:10px 8px}.rules-table th{padding:10px 8px}
.rule-item{margin-top:9px}.rule-item:first-of-type{margin-top:4px}.rule-item strong{font-size:12.5px;line-height:18.1px;display:flex;align-items:center;gap:7px}.rule-item code{display:block;margin-left:16px;line-height:16px}.rule-item p{margin:0 0 0 16px;font-size:12px;line-height:17.4px;color:var(--muted)}
.rule-item .dot{width:8px;height:8px;flex-shrink:0}
.note.lamp{display:flex;gap:12px;align-items:flex-start;line-height:17.4px;font-size:12px}.note.lamp .icon{color:var(--p);margin-top:1px}
.rule-bar{display:flex;align-items:center;gap:12px}.rule-bar .pill{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-weight:500;font-size:12.5px;background:#f1f0f6;color:#2e2b40;border-radius:20px;padding:8px 14px}

.reaction-side{text-align:center;font-size:12.5px;line-height:18.1px;color:var(--muted)}.reaction-side strong{font-size:15px;color:var(--ink);display:block}.reaction-side svg{display:block;margin:4px auto;width:120px;height:16px}
.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.products .molecule strong{display:block;font-size:12.5px;margin-top:8px}.products .molecule p{margin:7px 0 0;color:var(--muted);font-size:12.5px}
.card-head.lamp-title h2{display:flex;align-items:center;gap:10px}.card-head.lamp-title .icon{color:var(--p)}
.impl p{font-size:12.5px;line-height:18.1px;margin:0 0 7px 12px;color:#2e2b40}

@media(max-width:680px){.molecules,.products{grid-template-columns:minmax(0,1fr)}.reaction{grid-template-columns:minmax(0,1fr)}.rule-bar{flex-wrap:wrap}.pager{flex-wrap:wrap}}

function formulation(){return head('Formulasi Baru','Masukkan bahan disinfektan, target aroma, parameter mutu, dan fasilitas lab untuk memulai analisis.','','dashboard')+'<form id="formula" onsubmit="event.preventDefault();storeDraft();go(\'screening\')"><div class="grid two" style="align-items:stretch"><section class="card"><div class="card-head"><div class="row"><span class="num">1</span><div><h2>Bahan Disinfektan</h2><p>Zat aktif, surfaktan, dan pelarut beserta konsentrasinya</p></div></div><button type="button" class="small" onclick="pickLibrary()">Pilih dari Library</button></div><div id="ingredients">'+ingredient('Hydrogen Peroxide','CAS 7722–84–1 · zat aktif','3.0',1)+ingredient('Alcohol Ethoxylate C12–14 (S-01)','CAS 68439–50–9 · surfaktan nonionik','2.0',2)+ingredient('Water (Aqua)','CAS 7732–18–5 · pelarut','ad 100',3)+'</div><div class="ingredient empty"><span class="num gray">4</span><input class="grow" readonly placeholder="Cari bahan (nama / INCI / CAS)..." aria-label="Cari bahan" onclick="pickLibrary()"><input class="dose" disabled placeholder="% w/w" aria-label="Konsentrasi"></div><button class="wide soft" type="button" onclick="addIngredient(\'ingredients\')">+ Tambah Bahan Disinfektan</button><p class="muted tiny mt">3 bahan · total terhitung 5% + pelarut ad 100</p></section><section class="card"><span class="num mb">2</span><h2>Target Aroma (Parfum)</h2><p class="muted tiny">Aroma berfungsi sebagai penanda ruangan sudah disemprot dan menutupi bau zat aktif</p><p class="tiny mt">A. Preferensi aroma (boleh lebih dari satu)</p><div class="aromas">'+['Citrus','Floral','Fresh','Woody','Fruity','Herbal','Musky','Sweet'].map((t,i)=>'<button type="button" class="'+(i===0||i===2?'selected':'')+'" aria-pressed="'+(i===0||i===2)+'" onclick="this.classList.toggle(\'selected\');this.setAttribute(\'aria-pressed\',this.classList.contains(\'selected\'))"><span class="dot" style="background:'+['#e9a416','#e64d93','#25a16f','#925e35','#e54239','#518d3a','#aaa0bb','#c667d6'][i]+'"></span>'+t+'</button>').join('')+'</div><p class="tiny">B. Detail target</p><div class="form-grid">'+select('Intensitas aroma',['Sedang','Ringan','Kuat'],'intensity')+select('Karakter dominan',['Citrus segar','Floral lembut','Herbal segar','Woody'],'character')+select('Lama aroma tercium setelah disemprot',['15–30 menit (penanda ruangan)','5–15 menit','30–60 menit'],'duration')+'</div><label class="field">Deskripsi tambahan (opsional)<textarea name="description">Aroma lemon segar, tidak terlalu manis, cocok untuk ruang rawat. Tercium jelas saat disemprot lalu memudar, tidak meninggalkan bau menyengat.</textarea></label><p class="tiny">C. Kandidat parfum</p><div class="segmented wide"><button type="button" class="active" onclick="scenario(this,false)">Skenario A · Parfum sudah ada</button><button type="button" onclick="scenario(this,true)">Skenario B · Minta rekomendasi</button></div><div id="perfume-block"><div id="perfumes">'+ingredient('d-Limonene','CAS 5989–27–5','0.5',4,1)+'</div><div class="ingredient empty"><input class="grow" readonly placeholder="Cari bahan parfum..." aria-label="Cari bahan parfum" onclick="pickLibrary()"><input class="dose" disabled placeholder="% w/w" aria-label="Konsentrasi"></div><button type="button" class="wide soft" onclick="addIngredient(\'perfumes\')">+ Tambah Bahan Parfum</button></div><p class="muted tiny mt">Jika parfum ini berisiko tinggi, sistem akan menyusun campuran pengganti di tahap rekomendasi.</p></section></div><section class="card mt"><div class="card-head"><div class="row"><span class="num">3</span><div><h2>Target Produk dan Parameter Mutu LKPI</h2><p>Menjadi ambang lulus saat menilai kandidat dan hasil uji. Nilai dalam kurung siku diisi dari standar mutu LKPI.</p></div></div></div><div class="stats">'+field('Konsentrasi H₂O₂ target (% w/w)','3.0','target','number')+field('Retensi H₂O₂ minimum setelah uji','[90] %','retention')+field('Rentang pH','[3.0 – 4.5]','ph-range')+select('Uji stabilitas',['Accelerated stability test 40°C','Suhu ruang 25°C'],'stability')+'</div><div class="grid two"><div><p class="tiny">Kriteria keamanan ruangan medis</p>'+checks(['Tidak meninggalkan residu berbahaya di permukaan','Risiko iritasi pernapasan rendah saat disemprot','Alergen parfum mengikuti batas IFRA dan wajib label'])+'</div><div><p class="tiny">Strategi perlindungan aroma yang boleh dipakai</p>'+checks(['Solubilizer / surfaktan pelindung','Ko-solven dan penstabil (chelating agent)','Enkapsulasi (mis. siklodekstrin)','Rekonstruksi aroma dengan senyawa lebih tahan oksidasi'])+'</div></div></section><section class="card mt"><div class="card-head"><div class="row"><span class="num">4</span><div><h2>Alat dan Fasilitas Laboratorium</h2><p>Agar rekomendasi metode uji sesuai kemampuan lab</p></div></div><button type="button" class="primary small" onclick="addEquipment()">+ Tambah Alat</button></div><div id="equipment">'+table(['No.','Alat / metode uji','Kemampuan','Ketersediaan','Lokasi','Aksi'],[['pH meter','Mengukur pH','Tersedia'],['Titrasi permanganometri / iodometri','Kadar H₂O₂','Tersedia'],['UV–Vis spectrophotometer','Kejernihan / absorbansi','Perlu dijadwalkan'],['Climatic chamber 40°C / 75% RH','Accelerated stability test','Tersedia'],['GC–MS','Produk degradasi parfum','Eksternal']].map(([n,d,s],i)=>[i+1,'<strong>'+n+'</strong>',d,badge(s,s==='Tersedia'?'green':s==='Eksternal'?'':'amber'),i===4?'Lab mitra':'Internal','<button type="button" class="delete" aria-label="Hapus alat" onclick="this.closest(\'tr\').remove()"><svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg></button>']))+'</div><p class="muted tiny mt">5 alat terdaftar · 3 siap dipakai</p></section><section class="card mt"><div class="card-head"><div class="row"><span class="num">5</span><div><h2>Data Internal (opsional)</h2><p>SDS bahan, spesifikasi produk, atau catatan formulasi sebelumnya</p></div></div><label class="upload-btn" for="attachments">Unggah File</label></div><div class="dash tiny muted"><input id="attachments" type="file" accept=".pdf,.csv,.xlsx" multiple onchange="fileSelected(this)"><div id="file-label" class="mt">PDF, Excel, CSV (maks. 10 MB) · berkas dipilih secara lokal, belum dikirim ke server</div></div></section><div class="foot"><button type="button" onclick="state.draft={};save();render();toast(\'Formulir direset\')">Reset formulir</button><button class="primary">Lanjutkan ke Analisis →</button></div></form>'}
function scenario(b,v){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#perfume-block').classList.toggle('hidden',v)}
function storeDraft(){document.querySelectorAll('#formula [name]').forEach(el=>state.draft[el.name]=el.value);state.draft.ingredientRows=[...document.querySelectorAll('#ingredients .ingredient')].map(el=>({name:el.querySelector('strong')?.textContent||el.querySelector('input').value,description:el.querySelector('small')?.textContent||'Input lokal',value:el.querySelector('.dose').value}));state.draft.aromas=[...document.querySelectorAll('.aromas .selected')].map(el=>el.textContent.trim());save()}
function fileSelected(el){const valid=[...el.files].filter(f=>f.size<=10*1024*1024);$('#file-label').textContent=valid.map(f=>f.name).join(', ')||'Tidak ada berkas valid';if(valid.length!==el.files.length)toast('Berkas lebih dari 10 MB tidak diproses.')}
function addEquipment(){modal('Tambah alat','<form onsubmit="event.preventDefault();$(\'#equipment tbody\').insertAdjacentHTML(\'beforeend\',\'<tr><td>+</td><td>\'+esc($(\'#tool-name\').value)+\'</td><td>Ditambahkan pengguna</td><td>Tersedia</td><td>Internal</td><td>—</td></tr>\');$(\'#modal\').close()">'+field('Nama alat','','tool-name')+'<button class="primary">Tambah alat</button></form>');$('#tool-name').required=true}


const molPath=(d,w=2,c='#1d1b2e')=>d.map(x=>'<path d="'+x+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" fill="none"/>').join('');
const molText=(x,y,t,c='#1d1b2e',s=18)=>'<text x="'+x+'" y="'+y+'" text-anchor="middle" fill="'+c+'" font-size="'+s+'">'+t+'</text>';
const ringPaths=['M37.0617 29.6154V49.9231L19.4617 60.0769L1.86167 49.9231V29.6154L19.4617 19.4615','M19.4617 19.4615V.846154','M19.4617 60.0769V78.6923','M19.4617 78.6923 36.3847 88.8462','M19.4617 78.6923 2.53859 88.8462','M17.7694 74.4615 .846282 84.6154'];
const ring=(x,y=11.8)=>'<g transform="translate('+x+' '+y+')">'+molPath(ringPaths,1.69)+'</g>';
const molAccent=(x,y,d,w=1.69)=>'<g transform="translate('+x+' '+y+')">'+molPath(d,w,'#c0362c')+'</g>';
function molecule(kind){const box=(w,b)=>'<svg viewBox="0 0 '+w+' 110" role="img" aria-label="Struktur molekul '+kind+'">'+b+'</svg>';
if(kind==='peroxide')return box(210,'<g transform="translate(62 46)">'+molPath(['M1 21 17 7','M35 5 52 15','M70 15 85 1'])+'</g>'+molText(55,75,'H')+molText(87,50,'O','#c0362c')+molText(122,70,'O','#c0362c')+molText(155,44,'H'));
if(kind==='water')return box(210,'<g transform="translate(76 52)">'+molPath(['M21 1 1 19','M37 1 57 19'])+'</g>'+molText(105,50,'O','#c0362c')+molText(70,84,'H')+molText(140,84,'H'));
if(kind==='surfactant')return box(210,'<g transform="translate(101 50)">'+molPath(['M13 13 27 23','M27 23 41 13','M23 1H20V33H23','M59 1H62V33H59','M1 13 3 14'])+'</g>'+molPath(['M31 72 43 62 55 72 67 62 79 72 91 62 99 66'])+molText(108,68,'O','#c0362c',16)+molText(150,68,'O','#c0362c',16)+molText(177,68,'H','#1d1b2e',16)+molText(168,92,'n','#1d1b2e',11)+molText(68,96,'C12–14','#5e5a73',10));
if(kind==='limonene')return box(210,'<circle cx="113" cy="38" r="12.7" fill="#fdecec"/>'+ring(86.3)+molAccent(105,30.5,['M1 1 18.6 11.2','M1.9 6.1 15 13.7'],2)+molText(105,9,'CH₃','#1d1b2e',10));
const base=ring(52);
if(kind==='oxide')return box(141,base+molAccent(70.5,22,['M.8 9.3 16.1.8','M18.4 19.5 21.2 5.9'])+molText(98,21,'O','#c0362c',13));
if(kind==='carveol')return box(141,base+molAccent(88,33,['M.8 8.5 13.7.8'])+molText(113,34,'OH','#c0362c',13));
return box(141,base+molAccent(88,33,['M.8 8.5 13.7.8','M2.7 12.7 15.4 5.1'])+molText(110,34,'O','#c0362c',13))}
let screenTab='Kompatibilitas (SMARTS)';
const ruleBasis=[['Alkene C=C','[CX3]=[CX3]','Dapat teroksidasi menjadi epoksida','#c0362c'],['C–H alilik','[CX4;!H0][CX3]=[CX3]','Oksidasi alilik menjadi alkohol / keton','#e0a526'],['Aldehida','[CX3H1](=O)[#6]','Teroksidasi menjadi asam karboksilat','#e0a526'],['Fenol','c[OX2H]','Sensitif oksidasi, dapat berubah warna','#1a8a4f'],['Eter / polieter','[OD2]([CX4])[CX4]','Dapat membentuk peroksida saat disimpan','#2f6fd6'],['Amina tersier','[NX3;H0]([#6])([#6])[#6]','Membentuk amina oksida','#2f6fd6'],['Tioeter','[#16X2]([#6])[#6]','Teroksidasi menjadi sulfoksida','#6b57d6'],['Peroksida','[OX2][OX2]','Terurai, dipercepat logam jejak','#8d8a9c']];
function ruleRows(){const rows=risks.filter(r=>screenFilter==='Semua'||r[4]===screenFilter);return '<div class="table-wrap rules-table"><table><thead><tr>'+['Rule','Deskripsi','Pola SMARTS','Bahan terkait','Risiko','Evidensi','Aksi'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr class="'+(r[4]==='Tinggi'?'tint-red':r[4]==='Sedang'?'tint-amber':'')+'"><td><span class="rule-id">'+r[0]+'</span></td><td>'+r[1]+'</td><td><code>'+esc(r[2])+'</code></td><td>'+r[3]+'</td><td>'+badge(r[4],riskColor(r[4]))+'</td><td>'+r[5]+'</td><td><button class="small" onclick="viewRule(\''+r[0]+'\')">Lihat</button></td></tr>').join('')+'</tbody></table></div>'}
function screeningBody(){if(screenTab==='Keamanan bahan')return '<h2>Keamanan bahan yang dianalisis</h2><p class="muted tiny" style="margin:3px 0 0">Status keamanan contoh, diverifikasi dengan SDS pemasok dan IFRA Standards.</p>'+table(['Bahan','Keamanan','Sumber'],materials.filter(m=>/Hydrogen Peroxide|Alcohol Ethoxylate|d-Limonene/.test(m[0])).map(m=>[m[0],m[5],m[6]]));const tabs=[['Semua','Semua (8)'],['Tinggi','Risiko tinggi (1)'],['Sedang','Risiko sedang (2)'],['Peringatan','Peringatan (1)'],['Tidak terdeteksi','Tidak terdeteksi (4)']];return '<h2>Hasil pencocokan SMARTS antarbahan</h2><p class="muted tiny" style="margin:3px 0 0">Pola struktur yang terdeteksi pada bahan dan potensi reaksinya dengan H₂O₂</p><div class="tabs">'+tabs.map(([v,t])=>'<button class="'+(screenFilter===v?'active':'')+'" onclick="screenFilter=\''+v+'\';render()">'+t+'</button>').join('')+'</div>'+ruleRows()}
function screening(){return head('Hasil Screening dan Analisis','Identifikasi struktur molekul, pencocokan SMARTS, dan penapisan keamanan bahan untuk ruangan medis.','','formulasi')+'<div class="steps mb screen-steps" style="grid-template-columns:repeat(4,1fr)">'+[['Input formulasi','Bahan & target aroma','formulasi'],['Analisis struktur','PubChem · RDKit · SMARTS','screening'],['Analisis literatur','LLM + RAG','literatur'],['Rekomendasi formulasi','Ranking kandidat','rekomendasi']].map(([t,d,p],i)=>'<button class="step '+(i===1?'current':i>1?'todo':'')+'" onclick="go(\''+p+'\')"><span class="num '+(i>1?'gray':'')+'">'+(i===0?'✓':i+1)+'</span><span><strong>'+t+'</strong><p>'+d+'</p></span></button>').join('')+'</div><div class="grid split"><div class="stack">'+card('Molekul yang dianalisis','', '<div class="molecules">'+[['Hydrogen Peroxide','peroxide','784','7722-84-1','H₂O₂','34,01 g/mol'],['Alcohol Ethoxylate','surfactant','Campuran homolog','68439-50-9','R–(OCH₂CH₂)ₙ–OH','Bervariasi'],['Water (Aqua)','water','962','7732-18-5','H₂O','18,02 g/mol'],['d-Limonene (parfum)','limonene','440917','5989-27-5','C₁₀H₁₆','136,23 g/mol']].map(([n,k,c,cas,f,w],i)=>'<div class="molecule '+(i===3?'risk':'')+'"><h3>'+n+'</h3>'+badge(i===3?'Risiko tinggi':i===1?'Campuran':'Teridentifikasi',i===3?'red':i===1?'amber':'green')+molecule(k)+'<div class="meta"><span>PubChem CID</span><span>'+c+'</span><span>CAS</span><span>'+cas+'</span><span>Rumus</span><span>'+f+'</span><span>Berat molekul</span><span>'+w+'</span></div></div>').join('')+'</div>','<span class="run-meta">Bahan disinfektan (3) · Parfum (1)</span>')+'<section class="card"><div class="row between" style="margin-bottom:14px"><div class="segmented" style="margin:0">'+['Kompatibilitas (SMARTS)','Keamanan bahan'].map(t=>'<button class="'+(screenTab===t?'active':'')+'" onclick="screenTab=\''+t+'\';render()">'+t+'</button>').join('')+'</div><span class="run-meta">Dijalankan 10 Okt 2026 · RDKit</span></div>'+screeningBody()+'</section><div class="note lamp">'+'<svg class="icon" viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4M12 3a6 6 0 0 0-4 10.5c.9.8 1.5 1.8 1.5 3h5c0-1.2.6-2.2 1.5-3A6 6 0 0 0 12 3Z"/></svg>'+'<span><strong>Catatan.</strong> Hasil ini adalah indikasi risiko berdasarkan struktur molekul, bukan bukti pasti ketidakcocokan. Aturan berisiko ditelusuri ke literatur (LLM + RAG), lalu dibuktikan lewat uji laboratorium.</span></div></div><aside class="stack">'+card('Aturan SMARTS yang dipakai','Basis aturan awal untuk parfum dalam basis oksidator',ruleBasis.map(([n,c,d,k])=>'<div class="rule-item"><strong><span class="dot" style="background:'+k+'"></span>'+n+'</strong><code>'+esc(c)+'</code><p>'+d+'</p></div>').join('')+btn('Kelola basis aturan','pengaturan','wide mt small'))+card('Sumber data','',['PubChem Compound Summary (NIH), struktur dan identitas bahan','IFRA Standards Library, batas penggunaan bahan parfum','SDS pemasok dan data internal LKPI'].map((t,i)=>'<div class="row mt tiny"><span class="num gray">'+(i+1)+'</span>'+t+'</div>').join(''))+btn('Lanjut ke Analisis Literatur →','literatur','primary wide')+'</aside></div>'}
function viewRule(id){if(id==='R-01')go('literatur');else{const r=risks.find(x=>x[0]===id);modal(id+' · '+r[1],'<p><code>'+esc(r[2])+'</code></p><p>Bahan terkait: '+r[3]+'</p>'+badge(r[4],riskColor(r[4]))+'<p class="muted">Contoh hasil screening. Validasi pustaka dan tinjauan ahli kimia diperlukan pada sistem nyata.</p>'+btn('Buka analisis literatur contoh','literatur','primary'));}}
const cite=(...n)=>n.map(x=>'<span class="cite">'+x+'</span>').join('');
const litSources=[['Kinetika oksidasi limonene oleh H₂O₂ dan produknya','Artikel jurnal · [Penulis, tahun]'],['Reaksi alkena dan terpena dengan peroksida','Ensiklopedia teknik kimia'],['Stabilitas terpena dalam lingkungan pengoksidasi','Artikel jurnal kosmetik'],['Paten formulasi H₂O₂ beraroma yang stabil','Dokumen paten'],['Pengaruh logam jejak pada penguraian H₂O₂','Artikel jurnal'],['Pengaruh surfaktan pada oksidasi parfum','Artikel jurnal'],['Sensitisasi kulit oleh produk oksidasi limonene','Artikel jurnal']];
const productCards=()=>[['Limonene oxide','epoksidasi','oxide'],['Carveol','oksidasi alilik','carveol'],['Carvone','oksidasi lanjut','carvone']].map(([t,d,k])=>'<div class="molecule">'+molecule(k)+'<strong>'+t+'</strong><p>'+d+'</p></div>').join('');
function reactionMain(){return '<div class="reaction"><div class="molecule"><strong>d-Limonene</strong>'+molecule('limonene')+'<code>[CX3]=[CX3]</code></div><div class="reaction-side"><strong>+ H₂O₂</strong><svg viewBox="0 0 120 16"><path d="M1 8h116m-8-6 8 6-8 6" fill="none" stroke="#5232e0" stroke-width="2"/></svg>pH netral–basa,<br>suhu simpan tinggi</div></div><div class="products">'+productCards()+'</div>'}
function literature(){return head('Analisis Literatur (R-01)','Tinjau bukti ilmiah yang ditelusuri LLM + RAG untuk aturan yang terdeteksi.','','screening')+'<section class="card mb"><div class="row between"><div class="rule-bar"><span class="pill">R-01</span><div><strong style="font-size:15px">Ikatan rangkap C=C (alkene) pada d-Limonene</strong><div class="tiny muted">Pola SMARTS <code>[CX3]=[CX3]</code></div></div>'+badge('Risiko tinggi','red')+'</div><div class="row">'+btn('Kembali ke daftar','screening','small')+'<div class="pager"><button aria-label="Aturan sebelumnya" onclick="toast(\'Ini aturan berisiko pertama.\')">‹</button>1 dari 4 aturan berisiko<button aria-label="Aturan berikutnya" onclick="viewRule(\'R-04\')">›</button></div></div></div></section><div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><div class="stack">'+card('Ringkasan analisis LLM','', '<div class="note red">'+'<svg class="icon" viewBox="0 0 24 24"><path d="m12 4 9 16H3L12 4Zm0 6v4m0 3h.01"/></svg>'+'<span><b class="lead">Kesimpulan utama.</b> Ikatan rangkap C=C pada limonene dapat dioksidasi H₂O₂ menjadi limonene oxide, serta mengalami oksidasi alilik menjadi <strong>carveol dan carvone</strong> '+cite(1,2)+'. Akibatnya aroma citrus melemah atau berubah, dan <strong>sebagian H₂O₂ ikut terpakai</strong> '+cite(3)+'.</span></div><p class="tiny mt" style="margin-bottom:8px">Detail temuan</p><p class="finding">Laju oksidasi meningkat pada pH netral sampai basa dan pada suhu penyimpanan yang lebih tinggi '+cite(1,4)+'.</p><p class="finding">Logam jejak dari bahan atau kemasan mempercepat penguraian H₂O₂ dan pembentukan radikal '+cite(5)+'.</p><p class="finding">Jenis surfaktan dapat memperlambat atau mempercepat oksidasi, tergantung cara parfum terlarut dalam misel '+cite(6)+'.</p><p class="finding">Produk oksidasi limonene termasuk sensitizer kulit, sehingga relevan untuk keamanan pengguna '+cite(7)+'.</p>'+badge('Contoh ringkasan bersumber','green')+' '+badge('Ditin adar H₂O₂, aroma, dan warna selama accelerated stability test.</p></div><div class="row">'+btn('Diskusikan di Chat AI','chat','small')+btn('Lihat rekonstruksi aroma','aroma','small')+'</div></section>'+btn('Lanjut ke Rekomendasi Formulasi →','rekomendasi','primary wide')+'</div></div>'}

+'\')">'+(state.selected.includes(x[0])?'✓ Dipilih':'+ Pilih')+'</button></div><div class="badge mt" style="width:75%">'+x[4]+'</div></article>').join('')+'<p class="muted tiny">Kandidat teratas ditinjau formulator LKPI dan ahli kimia tim sebelum dibuat sampel.</p><button class="primary" onclick="saveCandidates()">Simpan ke Evaluasi Uji Coba →</button>','<span class="tiny muted">'+state.selected.length+' kandidat dipilih</span>')+card('Perbandingan kandidat','Skor tiap kriteria (0–1)','<div class="bars">'+[[90,80,62],[85,78,60],[74,84,86],[86,80,78],[80,66,82]].map(v=>'<div class="bar-group">'+v.map(n=>'<i style="height:'+n+'%"></i>').join('')+'</div>').join('')+'</div><div class="row between tiny muted"><span>Kompatibilitas</span><span>Stabilitas</span><span>Profil aroma</span><span>Keamanan</span><span>Feasibility</span></div><p class="tiny">🟪 F-01 · F-02 · F-03</p>')+'</div><aside>'+card('Detail kandidat '+c[0],'','<div class="tabs">'+['Komposisi & peran','Profil aroma','Analisis risiko','Metode & rencana uji','Dasar rekomendasi'].map(t=>'<button class="small '+(recommendTab===t?'active':'')+'" onclick="recommendTab=\''+t+'\';render()">'+t+'</button>').join('')+'</div><div class="row between"><div><small class="muted">Kode</small><h3>'+c[0]+'</h3></div><div><small class="muted">Skor total</small><h3>'+c[2]+'</h3></div><div><small class="muted">Aroma</small><h3>Citrus segar</h3></div></div>'+detail,badge(c[3],'green'))+'</aside></div>'}

0][i]+'%',['citrus, lime, fresh','fresh, floral, sedikit citrus','fruity, green','fruity, woody','musky, sweet'][i],['1 C=C terminal','Alkohol tersier jenuh','Ester, cincin aromatik','1 C=C dalam cincin','Diester makrosiklik'][i],badge(i===0||i===3?'Ditandai R-01':'Rendah',i===0||i===3?'red':'green')]))+'<p class="muted tiny">* Aturan R-01 saat ini menandai setiap C=C. Untuk C=C terminal atau terhalang, aturan perlu disempurnakan dan risikonya dibuktikan lewat uji stabilitas.</p><p class="tiny">Senyawa citrus yang ditolak sistem</p>'+table(['Senyawa','Alasan ditolak'],[['Citral','Aldehida dan C=C terkonjugasi, sangat mudah teroksidasi'],['Linalool','C=C trisubstitusi, dan alergen parfum wajib label'],['Decanal','Aldehida, teroksidasi menjadi asam dengan bau berbeda'],['Citronellol','C=C trisubstitusi (R-01)']]))+'</div><div>'+card('Profil deskriptor bau','Parfum awal dibanding campuran pengganti',['Citrus','Fresh','Lemon / lime','Sweet','Woody','Floral','Herbal'].map((t,i)=>'<div class="mt tiny"><strong>'+t+'</strong><div class="row"><span class="muted" style="width:74px">Limonene</span><div class="grow">'+progress([95,70,80,30,10,5,15][i],'#e4a51c')+'</div></div><div class="row"><span class="muted" style="width:74px">Campuran</span><div class="grow aroma-bar">'+progress([41,55,28,35,25,32,21][i])+'</div></div></div>').join('')+'<div class="note amber mt">Hasilnya <strong>mendekati</strong> profil target, bukan aroma yang sama. Skor kemiripan baru sah setelah uji panel.</div><button class="primary wide mt" onclick="toast(\'Campuran contoh dipilih untuk F-01\');activeCandidate=\'F-01\';go(\'rekomendasi\')">Gunakan di kandidat F-01</button>'+btn('Jadwalkan uji panel aroma','evaluasi','wide mt'))+'</div></div>'}

function filterTrials(){const q=$('#trial-search').value.toLowerCase(),selected=$('#trial-project').value==='Kandidat dipilih';let rows=trials.filter(r=>(trialFilter==='Semua'||r[5].startsWith(trialFilter))&&(!selected||state.selected.includes(r[0]))&&r.join(' ').toLowerCase().includes(q));if($('#trial-sort').value==='Kode formulasi')rows.sort((a,b)=>a[0].localeCompare(b[0]));$('#trial-table').innerHTML=rows.length?trialTable(rows):'<p class="muted" style="padding:28px;text-align:center">Tidak ada uji coba yang sesuai.</p>';$('#trial-count').textContent='Menampilkan '+rows.length+' dari '+trials.length+' formulasi'}

function experimentFields(){const wait=(k)=>'<label class="field">Waktu simpan<select data-exp="'+k+'" aria-label="Waktu simpan">'+['5 hari','2 hari','7 hari','14 hari'].map(x=>'<option '+(experimentData[k]===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label>';if(experimentTab==='Stabilitas kimia')return '<div class="test-row"><strong class="tiny">Kadar H₂O₂<br><span class="muted" style="font-weight:400">Titrasi permanganometri</span></strong><label class="field">Awal (%)<input id="initial" data-exp="initial" type="number" min=".001" max="100" step="any" value="'+esc(experimentData.initial)+'" oninput="calcRetention()"></label><label class="field">Setelah simpan (%)<input id="final" data-exp="final" type="number" min="0" max="100" step="any" value="'+esc(experimentData.final)+'" oninput="calcRetention()"></label>'+wait('waitH2O2')+'<div class="result">Retensi<br><strong id="retention-result">'+retentionValue().toFixed(1)+'% ✓</strong></div></div><div class="test-row"><strong class="tiny">pH<br><span class="muted" style="font-weight:400">pH meter</span></strong><label class="field">Awal<input data-exp="phInitial" type="number" min="0" max="14" step=".1" value="'+esc(experimentData.phInitial)+'"></label><label class="field">Setelah simpan<input data-exp="phFinal" type="number" min="0" max="14" step=".1" value="'+esc(experimentData.phFinal)+'"></label>'+wait('waitPh')+'<div class="result">ΔpH<br><strong>+0,1 ✓</strong></div></div><div class="test-row"><strong class="tiny">Warna / kejernihan<br><span class="muted" style="font-weight:400">Visual atau absorbansi</span></strong><label class="field">Metode<select data-exp="clarityMethod" aria-label="Metode"><option>Visual</option><option>Absorbansi</option></select></label><label class="field">Awal<input data-exp="clarityInitial" value="'+esc(experimentData.clarityInitial||'Jernih')+'"></label><label class="field">Setelah simpan<select data-exp="clarity"><option '+(experimentData.clarity==='Jernih'?'selected':'')+'>Jernih</option><option '+(experimentData.clarity==='Keruh'?'selected':'')+'>Keruh</option><option>Berubah warna</option></select></label><div class="result">Perubahan<br><strong>Tidak ada</strong></div></div><div class="test-row"><strong class="tiny">Produk degradasi<br><span class="muted" style="font-weight:400">GC-MS (opsional)</span></strong><label class="field">Ditemukan?<select data-exp="degradationFound"><option>Belum diuji</option><option>Ya</option><option>Tidak</option></select></label><label class="field">Senyawa utama<input data-exp="degradation" placeholder="mis. epoksida" aria-label="Senyawa degradasi" value="'+esc(experimentData.degradation||'')+'"></label><label class="field">ppm<input data-exp="degradationPpm" placeholder="–" value="'+esc(experimentData.degradationPpm||'')+'"></label><div class="result amber">Status<br><strong>Dijadwalkan</strong></div></div>';
if(experimentTab==='Profil aroma')return '<div class="form-grid">'+['Intensitas awal (0–5)','Intensitas setelah simpan (0–5)','Kemiripan aroma (0–5)'].map((t,i)=>'<label class="field">'+t+'<input data-exp="aroma'+i+'" type="number" min="0" max="5" step=".1" value="'+esc(experimentData['aroma'+i]||'3')+'"></label>').join('')+'</div><label class="field">Catatan panel<textarea data-exp="panel">'+esc(experimentData.panel||'')+'</textarea></label>';
if(experimentTab==='Karakteristik fisik')return '<div class="form-grid">'+select('Homogenitas',['Homogen','Terpisah'])+select('Warna',['Tidak berubah','Berubah'])+'</div><label class="field">Catatan fisik<textarea data-exp="physical">'+esc(experimentData.physical||'')+'</textarea></label>';
if(experimentTab==='Uji antimikroba')return '<div class="note amber">Catat hasil pengujian laboratorium. Aroma bukan bukti efikasi antimikroba.</div><label class="field mt">Metode uji<input data-exp="method" placeholder="Metode sesuai standar LKPI" value="'+esc(experimentData.method||'')+'"></label><label class="field">Hasil dan organisme uji<textarea data-exp="microbe">'+esc(experimentData.microbe||'')+'</textarea></label>';
return '<label class="field">Catatan eksperimen<textarea data-exp="notes" style="min-height:200px">'+esc(experimentData.notes)+'</textarea></label>'}
function retentionValue(){const a=Number(experimentData.initial),b=Number(experimentData.final);return a>0&&Number.isFinite(b)?b/a*100:0}
function calcRetention(){captureExperiment();const r=retentionValue();$('#retention-result').textContent=Number(experimentData.initial)>0?r.toFixed(1)+'%'+(r>=90?' ✓':''):'Kadar awal harus > 0';$('#retention-result').parentElement.style.background=r>=90?'#e5f5ec':'#fff3dc'}
function switchExperiment(t){captureExperiment();experimentTab=t;$('#experiment-tabs').innerHTML=experimentTabs();$('#experiment-fields').innerHTML=experimentFields()}
function experimentTabs(){return ['Stabilitas kimia','Profil aroma','Karakteristik fisik','Uji antimikroba','Catatan'].map(t=>'<button class="'+(t===experimentTab?'active':'')+'" onclick="switchExperiment(\''+t+'\')">'+t+'</button>').join('')}
function experiment(){return head('Input Hasil Eksperimen','Catat hasil uji lab untuk kandidat terpilih. Data ini memperbarui evaluasi dan menjadi data latih model.','','evaluasi')+'<div class="grid mb experiment-summary" style="grid-template-columns:1fr 1.65fr 1fr"><section class="card" style="height:100%;background:#faf8ff"><p class="tiny">Kandidat yang dipilih</p><div class="row"><span class="value" style="font-size:36px">'+activeCandidate+'</span>'+badge('Terkunci')+'</div><p class="muted tiny">'+(trials.find(r=>r[0]===activeCandidate)?.[1]||candidates[0][1])+'. Komposisi dikunci agar hasil uji dapat dibandingkan antar iterasi.</p>'+badge('Tahap 3 dari 4 · accelerated stability','blue')+'</section>'+card('Komposisi formula','Rentang rekomendasi vs nilai sampel',table(['Bahan','Rentang (% w/w)','Nilai sampel'],comp(activeCandidate).map((r,i)=>[r[0],r[1],['3,0','2,0','0,4','0,1','pH 3,6','ad 100'][i]])))+card('Profil target','',radar(),badge('Citrus segar','amber'))+'</div><div class="grid split"><div>'+card('Input hasil uji coba','Hasil laboratorium untuk kandidat '+activeCandidate,'<div id="experiment-tabs" class="tabs">'+experimentTabs()+'</div><div id="experiment-fields">'+experimentFields()+'</div><button class="wide soft" onclick="extraParameter()">+ Tambah parameter kimia lain</button>','<label class="tiny">Tanggal uji <input id="test-date" type="date" value="'+esc(experimentData.date)+'"></label>')+'</div><aside class="stack">'+card('Panduan pengisian','','<p class="tiny">Gunakan metode uji yang konsisten dengan SOP lab LKPI.</p><p class="tiny">Catat kondisi penyimpanan (25°C, 40°C, atau uji dipercepat).</p><p class="tiny">Hasil gagal tetap dicatat, karena berguna sebagai data latih.</p>')+card('Kondisi penyimpanan','','<div id="conditions" class="form-grid"><label class="field">Suhu<select data-exp="temperature"><option>40°C (dipercepat)</option><option>25°C (suhu ruang)</option></select></label><label class="field">Lama simpan<select data-exp="days"><option>5 hari</option><option>2 hari</option><option>7 hari</option><option>14 hari</option></select></label>'+select('Kemasan',['Botol HDPE','Botol PET','Kaca'])+select('Paparan cahaya',['Tertutup','Terpapar cahaya'])+'</div>')+card('Riwayat hasil '+activeCandidate,'',table(['Tanggal','Kondisi','H₂O₂','pH','Status'],[...state.results.filter(x=>x.candidate===activeCandidate).map(x=>[esc(x.date),esc(x.temperature)+', '+esc(x.days),esc(x.final),esc(x.phFinal),badge(x.draft?'Draf':x.outcome,x.draft?'':x.retention>=90?'green':'amber')]),['15 Okt','40°C, 5 hari','2,91','3,7',badge('OK','green')],['12 Okt','40°C, 2 hari','2,97','3,6',badge('OK','green')],['10 Okt','Awal','3,00','3,6',badge('OK','green')]]))+card('Gunakan untuk pembelajaran model','','<label class="check"><input id="use-training" type="checkbox" checked> Tambahkan hasil ini ke dataset latih</label><p class="muted tiny">Akan menjadi data ke-'+(39+state.results.filter(x=>!x.draft).length)+'. Model dilatih ulang otomatis setiap 10 data baru pada sistem nyata.</p>'+btn('Lihat learning curve','model','wide small'))+'</aside></div><div class="foot"><button onclick="saveExperiment(true)">Simpan sebagai draf</button><button class="primary" onclick="saveExperiment(false)">Simpan dan perbarui evaluasi →</button></div>'}
function extraParameter(){modal('Parameter tambahan','<form onsubmit="event.preventDefault();experimentData.extra=$(\'#extra-name\').value+\': \'+$(\'#extra-value\').value;$(\'#modal\').close();toast(\'Parameter ditambahkan. Simpan hasil untuk menyimpan ke browser.\')">'+field('Nama parameter','','extra-name')+field('Nilai dan satuan','','extra-value')+'<button class="primary">Tambahkan</button></form>')}
function saveExperiment(draft){captureExperiment();const a=Number(experimentData.initial),b=Number(experimentData.final);if(!(a>0&&a<=100&&b>=0&&b<=100)){toast('Kadar awal harus lebih dari 0 dan kadar berada pada 0–100%.');return}if(![experimentData.phInitial,experimentData.phFinal].every(v=>Number.isFinite(Number(v))&&Number(v)>=0&&Number(v)<=14)){toast('pH harus berada pada rentang 0 sampai 14.');return}if(!experimentData.date){toast('Isi tanggal uji.');return}const r=retentionValue(),outcome=experimentData.clarity!=='Jernih'||r<80?'Tidak lolos':r>=90?'Sementara memenuhi':'Perlu tinjauan';state.results.push({...experimentData,candidate:activeCandidate,retention:r,outcome,draft,training:$('#use-training').checked&&!draft});save();toast(draft?'Draf tersimpan di browser.':'Hasil uji tersimpan dan evaluasi diperbarui.');if(!draft)go('evaluasi')}
function learning(){return head('Pembelajaran Model','Model dilatih ulang dari hasil uji yang dicatat formulator, termasuk yang gagal. Galat prediksi diharapkan menurun seiring bertambahnya data.','<button class="primary" onclick="trainDemo()">Latih ulang sekarang</button>')+'<div class="segmented">'+btn('Daftar uji coba','evaluasi')+btn('Pembelajaran model','model','active')+'</div>'+'<div class="stats top-labels">'+[['<span class="row between">Data eksperimen <b>'+(38+state.results.filter(x=>x.training).length)+' / 60</b></span>','',progress(Math.min(100,(38+state.results.filter(x=>x.training).length)/60*100),'',true)+'<p>Minimum untuk mode prediksi: [60] data</p>'],['Versi model aktif',state.version,'<p>Dilatih 14 Okt 2026</p>'],['Latih ulang berikutnya','2 data lagi','<p>Otomatis setiap 10 data baru</p>'],['Status prediksi','',badge('Mode evaluasi','amber')+'<p>Prediksi ditampilkan sebagai pendukung, bukan keputusan</p>']].map(([l,v,x])=>'<section class="card stat"><span class="stat-top">'+l+'</span>'+(v?'<div class="value">'+v+'</div>':'')+x+'</section>').join('')+'</div>'+'<div class="grid split"><div class="stack">'+card('Learning curve','Galat validasi silang terhadap jumlah data eksperimen','<div id="learning-chart">'+curve(true)+'</div><div class="note amber mt">Kurva ini ilustrasi tampilan. Nilai galat nyata muncul setelah data eksperimen LKPI tersedia, dan target akurasi ditetapkan setelah data memadai.</div>','<div class="segmented"><button class="active" onclick="modelChart(this,0)">CatBoost</button><button onclick="modelChart(this,1)">XGBoost</button></div>')+card('Riwayat pelatihan ulang','',table(['Versi','Tanggal','Data latih','Galat vs versi sebelumnya','Catatan'],[['v0.4','14 Okt 2026','38',badge('↓ turun','green'),'Ditambah hasil F-04 dan F-05 yang gagal'],['v0.3','8 Okt 2026','28',badge('↓ turun','green'),'Data deskriptor bau Pyrfume ditambahkan'],['v0.2','1 Okt 2026','18',badge('≈ sama',''),'Data literatur dan SDS'],['v0.1','24 Sep 2026','10',badge('baseline',''),'Model awal']])+'<p class="tiny mt">Faktor paling berpengaruh pada prediksi retensi H₂O₂ (ilustrasi)</p>'+['pH formula','Chelating agent (HEDP)','Jumlah C=C pada parfum','Jenis surfaktan','Suhu penyimpanan'].map((t,i)=>'<div class="row tiny" style="margin:10px 0"><span style="width:200px">'+t+'</span><div class="grow">'+progress([88,70,62,40,35][i])+'</div></div>').join(''))+'</div><aside class="stack">'+card('Model dalam sistem','',[['MolFormer','Representasi struktur molekul (embedding). Model pralatih, tidak dilatih ulang.','Aktif'],['CatBoost','Prediksi retensi H₂O₂ setelah penyimpanan.','Evaluasi'],['XGBoost','Prediksi stabilitas fisik dan ketahanan aroma.','Evaluasi'],['Bayesian Optimization','Mengusulkan komposisi uji berikutnya yang paling informatif.','Aktif']].map(([n,d,s])=>'<div class="list-item"><span class="num">'+n[0]+'</span><div class="grow"><strong>'+n+'</strong><p>'+d+'</p></div>'+badge(s,s==='Aktif'?'green':'amber')+'</div>').join(''))+card('Usulan uji berikutnya','',table(['Bahan','Nilai'],[['Hydrogen Peroxide','3,0 %'],['Alcohol Ethoxylate (S-01)','1,8 %'],['Campuran aroma rekonstruksi','0,45 %'],['HEDP','0,15 %'],['pH target','3,9']])+'<p class="muted tiny"><strong>Alasan:</strong> wilayah pH 3,8–4,0 dengan dosis aroma lebih tinggi belum pernah diuji, sehingga hasilnya paling banyak menambah informasi bagi model.</p><button class="primary wide" onclick="newTrial()">Jadikan kandidat uji</button>'+btn('Diskusikan di Chat AI','chat','wide mt'),badge('Bayesian Optimization'))+'</aside></div>'}
function modelChart(b,n){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#learning-chart').innerHTML=curve(true)+(n?'<p class="muted tiny">XGBoost · Kurva contoh untuk stabilitas fisik dan aroma.</p>':'')}
function trainDemo(){modal('Pelatihan model','<p>Pelatihan CatBoost/XGBoost belum terhubung. Data hasil uji Anda tersimpan secara lokal; kurva yang ditampilkan tetap ilustratif.</p><p class="muted">Tidak ada pelatihan nyata yang dijalankan oleh prototipe ini.</p>'+btn('Lihat data eksperimen','evaluasi','primary'))}


const materials=[['Hydrogen Peroxide','Zat aktif','7722-84-1','Peroksida (R-08)','Peringatan','Iritan aerosol','PubChem, SDS'],['Alcohol Ethoxylate C12–14','Surfaktan','68439-50-9','Eter (R-04)','Sedang','Iritasi mata','SDS'],['Polysorbate 20','Surfaktan / solubilizer','9005-64-5','Eter (R-04)','Sedang','Rendah','SDS'],['PEG–40 Hydrogenated Castor Oil','Solubilizer','61788-85-0','Eter (R-04)','Sedang','Rendah','SDS'],['Propylene Glycol','Ko-solven','57-55-6','Tidak ada','Rendah','Rendah','PubChem'],['HEDP','Chelating agent','2809-21-4','Tidak ada','Rendah','Korosif pekat','PubChem, SDS'],['Sodium Stannate','Penstabil H₂O₂','12058-66-1','Tidak ada','Rendah','Rendah','SDS'],['Citric Acid','Pengatur pH','77-92-9','Tidak ada','Rendah','Rendah','PubChem'],['Trisodium Citrate','Buffer pH','68-04-2','Tidak ada','Rendah','Rendah','PubChem'],['β-Siklodekstrin','Enkapsulan','7585-39-9','Asetal (R-04)','Rendah','Rendah','PubChem'],['d-Limonene','Bahan aroma','5989-27-5','C=C (R-01), alilik (R-07)','Tinggi','Alergen, wajib label','PubChem, Pyrfume, IFRA'],['Linalool','Bahan aroma','78-70-6','C=C (R-01)','Tinggi','Alergen, wajib label','PubChem, Pyrfume, IFRA'],['Vanillin','Bahan aroma','121-33-5','Aldehida (R-02), fenol (R-03)','Tinggi','Rendah','PubChem, Pyrfume'],['Dihydromyrcenol','Bahan aroma','18479-58-8','C=C terminal (R-01)','Tinggi','Rendah','PubChem, Pyrfume'],['2,6–Dimethyl–2–heptanol','Bahan aroma','13254-34-7','Tidak ada','Rendah','Rendah','PubChem, Pyrfume'],['Methylbenzyl acetate','Bahan aroma','93-92-5','Tidak ada','Rendah','Rendah','PubChem, Pyrfume'],['Tricyclodecenyl propionate','Bahan aroma','17511-60-3','C=C (R-01)','Tinggi','Rendah','PubChem, Pyrfume'],['Ethylene brassylate','Bahan aroma','105-95-3','Tidak ada','Rendah','Rendah','PubChem, Pyrfume'],['Minyak nilam (patchouli)','Minyak atsiri lokal','8014-09-3','Campuran','Perlu analisis komponen','Cek alergen','SDS pemasok lokal'],['Minyak sereh wangi (citronella)','Minyak atsiri lokal','8000-29-1','Campuran mengandung C=C','Perlu analisis komponen','Alergen, wajib label','SDS pemasok lokal']];
function libraryRows(rows){return table(['Bahan','Kategori','CAS','Gugus rentan (SMARTS)','Risiko dengan H₂O₂','Keamanan','Sumber'],rows.map(r=>['<strong>'+esc(r[0])+'</strong>',esc(r[1]),'<span style="font-family:monospace">'+esc(r[2])+'</span>',esc(r[3]),badge(esc(r[4]),riskColor(r[4])),esc(r[5]),'<span class="muted">'+esc(r[6])+'</span>']))}
function library(){return head('Library Bahan','Basis data bahan disinfektan, surfaktan, penstabil, enkapsulan, dan bahan aroma beserta hasil screening otomatisnya.','<button onclick="importSDS()">Impor SDS</button><button class="primary" onclick="addMaterial()">+ Tambah Bahan</button>')+stats([[20+state.materials.length,'Bahan dalam library'],['5','Ditandai risiko tinggi dengan H₂O₂'],['2','Minyak atsiri lokal (nilam, sereh wangi)'],['PubChem ·<br>Pyrfume · IFRA','Sumber data contoh']])+'<section class="card"><div class="filters"><input id="library-search" placeholder="Cari nama, INCI, atau CAS..." aria-label="Cari bahan" oninput="filterLibrary()"><select id="risk-filter" aria-label="Tingkat risiko" onchange="libraryRisk=this.value;filterLibrary()">'+['Semua tingkat risiko','Tinggi','Sedang','Rendah','Peringatan','Perlu analisis komponen'].map(t=>'<option '+(t===libraryRisk?'selected':'')+'>'+t+'</option>').join('')+'</select></div><div class="tabs">'+['Semua','Zat aktif','Surfaktan','Penstabil & pH','Enkapsulan','Bahan aroma','Minyak atsiri lokal'].map(t=>'<button class="'+(t===libraryCategory?'active':'')+'" onclick="libraryCategory=\''+t+'\';this.parentElement.querySelectorAll(\'button\').forEach(b=>b.classList.remove(\'active\'));this.classList.add(\'active\');filterLibrary()">'+t+'</button>').join('')+'</div><div id="library-table">'+libraryRows([...materials,...state.materials])+'</div><p class="tiny muted mt">Risiko adalah hasil screening otomatis berbasis aturan dan perlu ditinjau ahli kimia. Status keamanan diverifikasi dengan SDS pemasok dan IFRA Standards terbaru.</p></section>'}
function filterLibrary(){const q=$('#library-search').value.toLowerCase();let rows=[...materials,...state.materials].filter(r=>(libraryRisk==='Semua tingkat risiko'||r[4]===libraryRisk)&&r.join(' ').toLowerCase().includes(q)&&(libraryCategory==='Semua'||(libraryCategory==='Penstabil & pH'?/penstabil|pH|chelating|Ko-solven/i.test(r[1]):libraryCategory==='Surfaktan'?/Surfaktan|Solubilizer/.test(r[1]):r[1]===libraryCategory)));$('#library-table').innerHTML=rows.length?libraryRows(rows):'<p class="muted" style="padding:28px;text-align:center">Tidak ada bahan yang cocok dengan pencarian.</p>'}
function addMaterial(){modal('Tambah Bahan','<form onsubmit="event.preventDefault();submitMaterial()">'+field('Nama bahan','','material-name')+select('Kategori',['Zat aktif','Surfaktan','Penstabil & pH','Enkapsulan','Bahan aroma','Minyak atsiri lokal'],'material-category')+field('Nomor CAS','','material-cas')+'<p class="muted tiny">Bahan baru ditandai perlu analisis; screening otomatis belum terhubung.</p><button class="primary">Simpan bahan</button></form>');$('#material-name').required=true}
function submitMaterial(){state.materials.push([$('#material-name').value,$('#material-category').value,$('#material-cas').value||'–','Belum dianalisis','Perlu analisis komponen','Belum diverifikasi','Input lokal']);save();$('#modal').close();render();toast('Bahan tersimpan di browser.')}
function importSDS(){modal('Impor SDS','<p class="muted tiny">Pilih dokumen SDS untuk melihat metadata berkas. Ekstraksi bahan dari PDF belum terhubung.</p><input type="file" accept=".pdf" onchange="document.getElementById(\'sds-info\').textContent=this.files[0]?this.files[0].name+\' · \'+Math.round(this.files[0].size/1024)+\' KB · dipilih secara lokal\':\'\'"><p id="sds-info" class="tiny"></p>')}
function pickLibrary(){modal('Pilih bahan dari Library','<div class="stack">'+materials.slice(0,10).map((r,i)=>'<button class="row between" onclick="insertMaterial('+i+')"><span>'+r[0]+'</span>'+badge(r[1],'')+'</button>').join('')+'</div>')}
function insertMaterial(i){const r=materials[i];$('#ingredients').insertAdjacentHTML('beforeend',ingredient(r[0],'CAS '+r[2]+' · '+r[1],'0.1',$('#ingredients').children.length+1));$('#modal').close()}
let messages=[{role:'user',text:'Kenapa kadar H₂O₂ pada F-03 turun lebih cepat dibanding F-01?'},{role:'ai',text:'Ada dua penyebab yang paling mungkin pada data contoh.\n1. F-03 masih memakai limonene yang ikatan C=C-nya kontak langsung dengan H₂O₂, sehingga sebagian H₂O₂ terpakai untuk mengoksidasi parfum. F-01 memakai campuran pengganti dengan gugus rentan yang lebih sedikit.\n2. F-03 tidak memakai chelating agent, sedangkan F-01 memakai HEDP yang mengikat logam jejak pemicu penguraian H₂O₂.\nHipotesis ini perlu diverifikasi melalui uji terkontrol dan tinjauan ahli kimia.'}];
function messageHTML(){return messages.map(m=>'<div class="message '+m.role+'">'+(m.role==='ai'?'<div class="row tiny"><span class="avatar" style="width:28px;height:28px">AI</span><strong>BAYLab AI</strong>'+badge('Simulasi','')+'</div><p>':'')+esc(m.text)+(m.role==='ai'?'</p><div class="tiny">'+badge('1 Uji F-03','')+' '+badge('2 Uji F-01','')+' '+badge('3 Screening R-01','')+' '+badge('4 Literatur','')+'</div>':'')+'</div>').join('')}
function chat(){return head('Chat with AI','Diskusikan hasil simulasi dan eksperimen. Jawaban merujuk data proyek dan literatur yang tersimpan (RAG).','<button class="primary" onclick="messages=[];render()">+ Percakapan baru</button>')+'<div class="chat-layout"><aside class="card chat-sidebar"><div class="tiny">Percakapan</div>'+['Penurunan H₂O₂ pada F-03','Campuran pengganti limonene','Pilihan chelating agent','Kenapa F-04 dihentikan'].map((t,i)=>'<button class="'+(i===0?'selected':'')+'" onclick="askChat(\''+t+'\')">'+t+'</button>').join('')+'</aside><section class="card chat-main"><div class="tiny muted">Konteks aktif: '+badge('PRJ-01')+' '+badge('Screening R-01')+' '+badge('Kandidat F-01 · F-03')+' '+badge('Uji 15 Okt')+'</div><div id="messages" class="messages">'+messageHTML()+'</div><div class="suggestions">'+['Bandingkan F-01 dan F-02 untuk ruang rawat','Apa risiko dihydromyrcenol?','Rangkum hasil uji minggu ini'].map(t=>'<button class="small" onclick="askChat(\''+t+'\')">'+t+'</button>').join('')+'</div><form class="row mt" onsubmit="event.preventDefault();askChat($(\'#chat-input\').value)"><input id="chat-input" placeholder="Tanyakan tentang hasil simulasi atau eksperimen..." aria-label="Pesan" required><button class="primary">Kirim</button></form><p class="muted tiny">Jawaban AI adalah contoh simulasi, bukan layanan AI terhubung. Keputusan formula tetap ditinjau formulator dan ahli kimia.</p></section><aside class="stack">'+card('Terhubung ke modul','',['Knowledge Screening','Formulation Analysis & Recommendation','Experiment Tracking','Library Bahan'].map((t,i)=>'<p class="tiny"><span class="dot"></span><a style="color:var(--ink)" href="#'+['screening','rekomendasi','evaluasi','library'][i]+'">'+t+'</a></p>').join(''))+card('Sumber jawaban terakhir','',['Data uji F-03, 13 Okt 2026 (internal)','Data uji F-01, 15 Okt 2026 (internal)','Hasil screening R-01 dan R-04','[Contoh] Artikel tentang oksidasi limonene oleh H₂O₂'].map((t,i)=>'<div class="row tiny mt">'+badge(i+1)+'<span>'+t+'</span></div>').join(''))+'</aside></div>'}
function askChat(q){q=q.trim();if(!q)return;let a='Prototipe ini hanya menyediakan jawaban contoh dari rancangan BAYLab AI. Pertanyaan tersebut belum dapat dijawab dengan sumber terverifikasi. Tinjau halaman screening, rekomendasi, atau hasil eksperimen; layanan RAG belum terhubung.';if(/F-03|penurunan|turun/i.test(q))a='Dalam data contoh, F-03 menggunakan limonene dengan gugus C=C dan belum menggunakan HEDP. F-01 menggunakan campuran aroma rekonstruksi serta HEDP. Perbedaan ini merupakan hipotesis penyebab penurunan kadar, bukan kesimpulan eksperimen.';else if(/bandingkan|F-02/i.test(q))a='F-01: campuran aroma citrus rekonstruksi + chelating agent, skor ilustratif 0,84.\nF-02: limonene terenkapsulasi β-siklodekstrin, skor ilustratif 0,78.\nPilihan perlu didukung hasil uji stabilitas, panel aroma, dan efikasi.';else if(/dihydro|pengganti|limonene/i.test(q))a='Pada desain, campuran rekonstruksi terdiri dari 5 senyawa. Dihydromyrcenol dan tricyclodecenyl propionate masih ditandai R-01 karena C=C. Skor kemiripan contoh 0,72 bukan bukti kemiripan aroma; perlu uji panel.';else if(/HEDP|chelating/i.test(q))a='HEDP muncul pada kandidat F-01 dan F-02 sebagai chelating agent. Perannya dalam rancangan adalah mengikat logam jejak. Komposisi contoh belum merupakan formula tervalidasi.';else if(/F-04/i.test(q))a='Pada data contoh, F-04 (linalool, floral) dihentikan karena aroma berubah setelah satu minggu. Hasil gagal tetap dicatat untuk evaluasi berikutnya.';else if(/rangkum|minggu/i.test(q))a='Data contoh: F-01 dan F-02 sedang berjalan, F-03 menunggu hasil, F-04 dihentikan, F-05 dan F-06 selesai evaluasi.\nHasil tambahan yang tersimpan di browser: '+state.results.filter(r=>!r.draft).length+' catatan.';messages.push({role:'user',text:q},{role:'ai',text:a});$('#messages').innerHTML=messageHTML();$('#chat-input').value='';$('#messages').lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'})}
const settingTabs=['Parameter mutu LKPI','Bobot kriteria','Model AI','Sumber data','Pengguna dan akses'];
const parameterRows=[['Retensi H₂O₂ setelah accelerated stability','≥ [90] %','Titrasi','Asumsi tim'],['Rentang pH','[3,0–4,5]','pH meter','Asumsi tim'],['Homogenitas dan pemisahan fase','Tidak ada','Visual','Brief LKPI'],['Intensitas aroma saat disemprot (panel 0–5)','≥ [3]','Organoleptik','Asumsi tim'],['Lama aroma tercium','15–30 menit','Organoleptik','Asumsi tim'],['Efikasi antimikroba','[standar LKPI]','SNI EN 13727','Menunggu LKPI']];
function settingsBody(){if(settingTab==='Parameter mutu LKPI')return card(settingTab,'Menjadi ambang lulus di Rekomendasi dan Evaluasi Uji Coba. Nilai dalam kurung siku menunggu standar mutu resmi dari LKPI.',table(['Parameter','Ambang lulus','Metode','Sumber nilai'],parameterRows.map((r,i)=>[r[0],'<input data-setting="param'+i+'" aria-label="'+r[0]+'" value="'+esc(state.settings['param'+i]??r[1])+'">',r[2],badge(r[3],r[3]==='Asumsi tim'?'amber':r[3]==='Brief LKPI'?'green':'')])));if(settingTab==='Bobot kriteria')return card(settingTab,'Bobot tersimpan sebagai konfigurasi prototipe. Ranking contoh tidak dihitung ulang.',table(['Kriteria','Bobot (%)'],['Kompatibilitas','Stabilitas','Profil aroma','Keamanan','Feasibility'].map((t,i)=>[t,'<input data-setting="weight'+i+'" type="number" min="0" max="100" aria-label="Bobot '+t+'" value="'+esc(state.settings['weight'+i]??[25,25,20,20,10][i])+'">'])));if(settingTab==='Model AI')return card(settingTab,'Konfigurasi pembelajaran dari eksperimen.',['MolFormer','CatBoost','XGBoost','Bayesian Optimization'].map(t=>'<div class="list-item"><span class="num">'+t[0]+'</span><div class="grow"><strong>'+t+'</strong><p>Belum terhubung pada prototipe lokal</p></div>'+badge('Simulasi','amber')+'</div>').join(''));if(settingTab==='Sumber data')return card(settingTab,'Sumber yang direncanakan dalam proposal.',table(['Sumber','Kegunaan','Status'],[['PubChem','Struktur dan identitas bahan',badge('Belum terhubung','amber')],['Pyrfume','Deskriptor aroma',badge('Belum terhubung','amber')],['IFRA','Standar bahan aroma',badge('Belum terhubung','amber')],['SDS internal LKPI','Data bahan',badge('Impor lokal','')]]));return card(settingTab,'Akses dalam prototipe hanya menggunakan akun demo.',table(['Nama','Peran','Status'],[['Dewi','Formulator R&D',badge('Akun demo','green')]]))}
function settings(){return head('Pengaturan','Atur ambang mutu LKPI, bobot kriteria rekomendasi, model AI, sumber data, dan akses pengguna.','<button class="primary" onclick="saveSettings()">Simpan perubahan</button>')+'<div class="settings-layout"><aside class="card settings-menu">'+settingTabs.map(t=>'<button class="'+(settingTab===t?'active':'')+'" onclick="captureSettings();settingTab=\''+t+'\';render()">'+t+'</button>').join('')+'</aside><div id="settings-body">'+settingsBody()+'</div></div>'}
function captureSettings(){document.querySelectorAll('[data-setting]').forEach(el=>state.settings[el.dataset.setting]=el.value)}
function saveSettings(){captureSettings();if(settingTab==='Bobot kriteria'){const sum=[0,1,2,3,4].reduce((s,i)=>s+Number(state.settings['weight'+i]??[25,25,20,20,10][i]),0);if(Math.abs(sum-100)>.001){toast('Total bobot harus 100%. Saat ini '+sum+'%.');return}}if(save())toast('Pengaturan disimpan di browser ini.')}
const views={login,dashboard,formulasi:formulation,screening,literatur:literature,rekomendasi:recommendations,aroma,evaluasi:evaluation,input:experiment,model:learning,chat,library,pengaturan:settings};
function render(){const r=route(),v=views[r]||dashboard;document.title=(navs.find(x=>x[0]===r)?.[1]||({login:'Masuk',literatur:'Analisis Literatur',aroma:'Rekonstruksi Aroma',input:'Input Hasil Eksperimen',model:'Pembelajaran Model'}[r])||'BAYLab AI')+' · BAYLab AI';$('#app').innerHTML=r==='login'?login():shell(v());if(r==='formulasi'){if(state.draft.ingredientRows)$('#ingredients').innerHTML=state.draft.ingredientRows.map((x,i)=>ingredient(esc(x.name),esc(x.description),esc(x.value),i+1)).join('');if(state.draft.aromas)document.querySelectorAll('.aromas button').forEach(el=>{const selected=state.draft.aromas.includes(el.textContent.trim());el.classList.toggle('selected',selected);el.setAttribute('aria-pressed',selected)});document.querySelectorAll('#formula [name]').forEach(el=>{if(state.draft[el.name]!=null)el.value=state.draft[el.name]})}if(r==='dashboard'){document.querySelector('.dashboard .stats .stat:last-child').innerHTML='<div class="tiny">Data eksperimen untuk model</div><div><strong style="font-size:19px">'+(38+state.results.filter(x=>x.training).length)+' / 60</strong>'+progress(Math.min(100,(38+state.results.filter(x=>x.training).length)/60*100),'',true)+'</div><p>Model masih mode evaluasi sampai data minimum terpenuhi</p>'}if(r==='library')filterLibrary();if(r==='evaluasi')filterTrials();if(r==='input')document.querySelectorAll('[data-exp]').forEach(el=>{if(experimentData[el.dataset.exp]!=null)el.value=experimentData[el.dataset.exp]});window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{if($('#modal').open)$('#modal').close();render()});render();
</script></body></html>
