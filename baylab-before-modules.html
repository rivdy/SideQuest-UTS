function formulation(){return head('Formulasi Baru','Masukkan bahan disinfektan, target aroma, parameter mutu, dan fasilitas lab untuk memulai analisis.','','dashboard')+'<form id="formula" onsubmit="event.preventDefault();storeDraft();go(\'screening\')"><div class="grid two" style="align-items:stretch"><section class="card"><div class="card-head"><div class="row"><span class="num">1</span><div><h2>Bahan Disinfektan</h2><p>Zat aktif, surfaktan, dan pelarut beserta konsentrasinya</p></div></div><button type="button" class="small" onclick="pickLibrary()">Pilih dari Library</button></div><div id="ingredients">'+ingredient('Hydrogen Peroxide','CAS 7722–84–1 · zat aktif','3.0',1)+ingredient('Alcohol Ethoxylate C12–14 (S-01)','CAS 68439–50–9 · surfaktan nonionik','2.0',2)+ingredient('Water (Aqua)','CAS 7732–18–5 · pelarut','ad 100',3)+'</div><button class="wide soft" type="button" onclick="addIngredient(\'ingredients\')">+ Tambah Bahan Disinfektan</button><p class="muted tiny mt">3 bahan · total terhitung 5% + pelarut ad 100</p></section><section class="card"><span class="num mb">2</span><h2>Target Aroma (Parfum)</h2><p class="muted tiny">Aroma berfungsi sebagai penanda ruangan sudah disemprot dan menutupi bau zat aktif</p><p class="tiny mt">A. Preferensi aroma (boleh lebih dari satu)</p><div class="aromas">'+['Citrus','Floral','Fresh','Woody','Fruity','Herbal','Musky','Sweet'].map((t,i)=>'<button type="button" class="'+(i===0||i===2?'selected':'')+'" aria-pressed="'+(i===0||i===2)+'" onclick="this.classList.toggle(\'selected\');this.setAttribute(\'aria-pressed\',this.classList.contains(\'selected\'))"><span class="dot" style="background:'+['#e9a416','#e64d93','#25a16f','#925e35','#e54239','#518d3a','#aaa0bb','#c667d6'][i]+'"></span>'+t+'</button>').join('')+'</div><p class="tiny">B. Detail target</p><div class="form-grid">'+select('Intensitas aroma',['Sedang','Ringan','Kuat'],'intensity')+select('Karakter dominan',['Citrus segar','Floral lembut','Herbal segar','Woody'],'character')+select('Lama aroma tercium setelah disemprot',['15–30 menit (penanda ruangan)','5–15 menit','30–60 menit'],'duration')+'</div><label class="field">Deskripsi tambahan (opsional)<textarea name="description">Aroma lemon segar, tidak terlalu manis, cocok untuk ruang rawat. Tercium jelas saat disemprot lalu memudar, tidak meninggalkan bau menyengat.</textarea></label><p class="tiny">C. Kandidat parfum</p><div class="segmented wide"><button type="button" class="active" onclick="scenario(this,false)">Skenario A · Parfum sudah ada</button><button type="button" onclick="scenario(this,true)">Skenario B · Minta rekomendasi</button></div><div id="perfume-block"><div id="perfumes">'+ingredient('d-Limonene','CAS 5989–27–5','0.5',4)+'</div><button type="button" class="wide soft" onclick="addIngredient(\'perfumes\')">+ Tambah Bahan Parfum</button></div><p class="muted tiny mt">Jika parfum ini berisiko tinggi, sistem akan menyusun campuran pengganti di tahap rekomendasi.</p></section></div><section class="card mt"><div class="card-head"><div class="row"><span class="num">3</span><div><h2>Target Produk dan Parameter Mutu LKPI</h2><p>Menjadi ambang lulus saat menilai kandidat dan hasil uji. Nilai dalam kurung siku diisi dari standar mutu LKPI.</p></div></div></div><div class="stats">'+field('Konsentrasi H₂O₂ target (% w/w)','3.0','target','number')+field('Retensi H₂O₂ minimum setelah uji','[90] %','retention')+field('Rentang pH','[3.0 – 4.5]','ph-range')+select('Uji stabilitas',['Accelerated stability test 40°C','Suhu ruang 25°C'],'stability')+'</div><div class="grid two"><div><p class="tiny">Kriteria keamanan ruangan medis</p>'+checks(['Tidak meninggalkan residu berbahaya di permukaan','Risiko iritasi pernapasan rendah saat disemprot','Alergen parfum mengikuti batas IFRA dan wajib label'])+'</div><div><p class="tiny">Strategi perlindungan aroma yang boleh dipakai</p>'+checks(['Solubilizer / surfaktan pelindung','Ko-solven dan penstabil (chelating agent)','Enkapsulasi (mis. siklodekstrin)','Rekonstruksi aroma dengan senyawa lebih tahan oksidasi'])+'</div></div></section><section class="card mt"><div class="card-head"><div class="row"><span class="num">4</span><div><h2>Alat dan Fasilitas Laboratorium</h2><p>Agar rekomendasi metode uji sesuai kemampuan lab</p></div></div><button type="button" class="primary small" onclick="addEquipment()">+ Tambah Alat</button></div><div id="equipment">'+table(['No.','Alat / metode uji','Kemampuan','Ketersediaan','Lokasi','Aksi'],[['pH meter','Mengukur pH','Tersedia'],['Titrasi permanganometri / iodometri','Kadar H₂O₂','Tersedia'],['UV–Vis spectrophotometer','Kejernihan / absorbansi','Perlu dijadwalkan'],['Climatic chamber 40°C / 75% RH','Accelerated stability test','Tersedia'],['GC–MS','Produk degradasi parfum','Eksternal']].map(([n,d,s],i)=>[i+1,'<strong>'+n+'</strong>',d,badge(s,s==='Tersedia'?'green':s==='Eksternal'?'':'amber'),i===4?'Lab mitra':'Internal','<button type="button" class="delete" aria-label="Hapus alat" onclick="this.closest(\'tr\').remove()">×</button>']))+'</div><p class="muted tiny mt">5 alat terdaftar · 3 siap dipakai</p></section><section class="card mt"><div class="card-head"><div class="row"><span class="num">5</span><div><h2>Data Internal (opsional)</h2><p>SDS bahan, spesifikasi produk, atau catatan formulasi sebelumnya</p></div></div></div><div class="dash tiny muted"><input id="attachments" type="file" accept=".pdf,.csv,.xlsx" multiple onchange="fileSelected(this)"><div id="file-label" class="mt">PDF, Excel, CSV (maks. 10 MB) · berkas dipilih secara lokal, belum dikirim ke server</div></div></section><div class="foot"><button type="button" onclick="state.draft={};save();render();toast(\'Formulir direset\')">Reset formulir</button><button class="primary">Lanjutkan ke Analisis →</button></div></form>'}

function storeDraft(){document.querySelectorAll('#formula [name]').forEach(el=>state.draft[el.name]=el.value);state.draft.ingredientRows=[...document.querySelectorAll('#ingredients .ingredient')].map(el=>({name:el.querySelector('strong')?.textContent||el.querySelector('input').value,description:el.querySelector('small')?.textContent||'Input lokal',value:el.querySelector('.dose').value}));state.draft.aromas=[...document.querySelectorAll('.aromas .selected')].map(el=>el.textContent.trim());save()}

isiko','Evidensi','Aksi'],risks.filter(r=>screenFilter==='Semua'||r[4]===screenFilter).map(r=>[r[0],r[1],'<code>'+esc(r[2])+'</code>',r[3],badge(r[4],riskColor(r[4])),r[5],'<button class="small" onclick="viewRule(\''+r[0]+'\')">Lihat</button>'])))+'<div class="note"><strong>Catatan.</strong> Hasil ini adalah indikasi risiko berdasarkan struktur molekul, bukan bukti pasti ketidakcocokan. Aturan berisiko ditelusuri ke literatur, lalu dibuktikan lewat uji laboratorium.</div></div><aside class="stack">'+card('Aturan SMARTS yang dipakai','Basis aturan awal untuk parfum dalam basis oksidator',risks.map(r=>'<div class="mt tiny"><strong><span class="dot" style="background:'+(['Tinggi','Sedang'].includes(r[4])?'#da4c38':'#7958eb')+'"></span>'+r[1]+'</strong><br><code>'+esc(r[2])+'</code></div>').join('')+btn('Kelola basis aturan','pengaturan','wide mt small'))+card('Sumber data','',['PubChem Compound Summary (NIH), struktur dan identitas bahan','IFRA Standards Library, batas penggunaan bahan parfum','SDS pemasok dan data internal LKPI'].map((t,i)=>'<div class="row mt tiny"><span class="num gray">'+(i+1)+'</span>'+t+'</div>').join(''))+btn('Lanjut ke Analisis Literatur →','literatur','primary wide')+'</aside></div>'}
function viewRule(id){if(id==='R-01')go('literatur');else{const r=risks.find(x=>x[0]===id);modal(id+' · '+r[1],'<p><code>'+esc(r[2])+'</code></p><p>Bahan terkait: '+r[3]+'</p>'+badge(r[4],riskColor(r[4]))+'<p class="muted">Contoh hasil screening. Validasi pustaka dan tinjauan ahli kimia diperlukan pada sistem nyata.</p>'+btn('Buka analisis literatur contoh','literatur','primary'));}}
function literature(){return head('Analisis Literatur (R-01)','Tinjau bukti ilmiah yang ditelusuri LLM + RAG untuk aturan yang terdeteksi.','','screening')+'<section class="card mb"><div class="row between"><div class="row"><span class="num gray" style="width:58px;border-radius:25px">R-01</span><div><strong>Ikatan rangkap C=C (alkene) pada d-Limonene</strong><div class="tiny muted">Pola SMARTS <code>[CX3]=[CX3]</code></div></div>'+badge('Risiko tinggi','red')+'</div>'+btn('Kembali ke daftar','screening','small')+'</div></section><div class="grid two"><div class="stack">'+card('Ringkasan analisis LLM','', '<div class="note red"><strong>⚠ Kesimpulan utama.</strong> Ikatan rangkap C=C pada limonene dapat dioksidasi H₂O₂ menjadi limonene oxide, serta mengalami oksidasi alilik menjadi carveol dan carvone. Akibatnya aroma citrus melemah atau berubah, dan sebagian H₂O₂ ikut terpakai.</div><p class="tiny mt">Detail temuan</p><ul class="tiny" style="padding-left:18px;line-height:1.8"><li>Laju oksidasi meningkat pada pH netral sampai basa dan pada suhu penyimpanan yang lebih tinggi.</li><li>Logam jejak dari bahan atau kemasan mempercepat penguraian H₂O₂ dan pembentukan radikal.</li><li>Jenis surfaktan dapat memperlambat atau mempercepat oksidasi.</li><li>Produk oksidasi limonene termasuk sensitizer kulit, sehingga relevan untuk keamanan pengguna.</li></ul>'+badge('Contoh ringkasan bersumber','green')+' '+badge('Ditinjau ahli kimia: belum',''),badge('Berdasarkan 7 sumber'))+card('Sumber ilmiah yang digunakan','Judul di bawah adalah contoh tampilan. Pada sistem nyata, daftar ini diisi otomatis dari hasil penelusuran RAG.', ['Kinetika oksidasi limonene oleh H₂O₂ dan produknya','Reaksi alkena dan terpena dengan peroksida','Stabilitas terpena dalam lingkungan pengoksidasi','Paten formulasi H₂O₂ beraroma yang stabil','Pengaruh logam jejak pada penguraian H₂O₂','Pengaruh surfaktan pada oksidasi parfum','Sensitisasi kulit oleh produk oksidasi limonene'].map((t,i)=>'<div class="list-i mendasi','primary wide')+'</div></div>'}
function reactionTab(b,n){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#reaction').innerHTML=n===0?'<div class="molecule">'+molecule('limonene')+'d-Limonene + H₂O₂ → limonene oxide, carveol, carvone (ilustrasi)</div>':n===1?'<div class="molecule">'+molecule('limonene')+'<strong>Ikatan rangkap C=C dan C–H alilik</strong><p class="muted tiny">R-01 dan R-07 menandai gugus rentan pada contoh molekul ini.</p></div>':'<div class="stack">'+['Limonene oxide · epoksidasi','Carveol · oksidasi alilik','Carvone · oksidasi lanjut'].map(t=>'<div class="list-item">'+t+'</div>').join('')+'</div>'}

function recommendations(){const c=candidates.find(x=>x[0]===activeCandidate)||candidates[0];let detail=recommendTab==='Komposisi & peran'?table(['Bahan','% w/w','Peran'],comp(c[0])):recommendTab==='Profil aroma'?radar()+'<p class="muted">Profil citrus segar · kemiripan harus diverifikasi melalui uji organoleptik.</p>':recommendTab==='Analisis risiko'?'<div class="note amber">Risiko struktur dan stabilitas masih harus diverifikasi melalui eksperimen. Skor pada halaman ini adalah contoh tampilan.</div>':recommendTab==='Metode & rencana uji'?table(['Tahap','Pengujian'],[['1','Pembuatan sampel dan pencatatan komposisi'],['2','Kadar H₂O₂, pH, kejernihan awal'],['3','Accelerated stability'],['4','Efikasi dan panel aroma']]):'<div class="note">Contoh pemeringkatan menggunakan kompatibilitas, stabilitas, profil aroma, keamanan, dan kelayakan uji.</div>';
return head('Rekomendasi Formulasi','Kandidat diperingkat berdasarkan kompatibilitas, stabilitas, kesesuaian aroma, keamanan, dan kelayakan uji.','','literatur')+'<div class="grid split"><div class="stack">'+card('Ringkasan input','', '<div class="grid two tiny"><div class="meta"><span>Hydrogen Peroxide</span><span>'+esc(state.draft.target||'3')+' % w/w</span><span>Alcohol Ethoxylate (S-01)</span><span>2 % w/w</span><span>Water</span><span>ad 100</span><span>Parfum awal</span><span>d-Limonene 0,5% (Skenario A)</span></div><div><strong>Target aroma</strong><p class="muted">Citrus segar, intensitas sedang<br>15–30 menit setelah disemprot<br>Retensi H₂O₂ ≥ [90]%, pH [3,0–4,5]</p></div></div><div class="note red mt"><strong>Limonene berisiko tinggi (R-01).</strong> Sistem menyusun kandidat F-01 dengan campuran aroma pengganti yang lebih tahan oksidasi. <a href="#aroma">Lihat rekonstruksi aroma</a></div>',btn('Ubah input','formulasi','link small'))+card('Kandidat formulasi','Pilih kandidat untuk dibuat sampel dan dipantau di Evaluasi Uji Coba',candidates.map((x,i)=>'<article class="candidate '+(activeCandidate===x[0]?'selected':'')+'">'+radar()+'<div class="row"><h3>'+x[0]+'</h3>'+badge(x[3],['green','blue','red'][i])+'</div><p class="tiny"><strong>'+x[1]+'</strong></p><div class="meta">'+comp(x[0]).slice(0,5).map(r=>'<span>'+r[0]+'</span><span>'+r[1]+'</span>').join('')+'</div><div class="row between mt"><div><span class="value">'+x[2].toFixed(2)+'</span> <span class="tiny muted">skor total</span></div><button class="primary small" onclick="activeCandidate=\''+x[0]+'\';render()">Lihat detail</button></div><div class="row between mt"><div class="meta">'+['Kompatibilitas','Stabilitas','Profil aroma','Keamanan','Feasibility'].map((t,j)=>'<span>'+t+'</span><span>'+[[.90,.85,.74,.86,.80],[.80,.78,.84,.80,.66],[.62,.60,.86,.78,.82]][i][j].toFixed(2)+'</span>').join('')+'</div><button class="'+(state.selected.includes(x[0])?'soft':'')+' small" onclick="toggleCandidate(\''+x[0]+'\')">'+(state.selected.includes(x[0])?'✓ Dipilih':'+ Pilih')+'</button></div><div class="badge mt" style="width:75%">'+x[4]+'</div></article>').join('')+'<p class="muted tiny">Kandidat teratas ditinjau formulator LKPI dan ahli kimia tim sebelum dibuat sampel.</p><button class="primary" onclick="saveCandidates()">Simpan ke Evaluasi Uji Coba →</button>','<span class="tiny muted">'+state.selected.length+' kandidat dipilih</span>')+card('Perbandingan kandidat','Skor tiap kriteria (0–1)','<div class="bars">'+[[90,80,62],[85,78,60],[74,84,86],[86,80,78],[80,66,82]].map(v=>'<div class="bar-group">'+v.map(n=>'<i style="height:'+n+'%"></i>').join('')+'</div>').join('')+'</div><div class="row between tiny muted"><span>Kompatibilitas</span><span>Stabilitas</span><span>Profil aroma</span><span>Keamanan</span><span>Feasibility</span></div><p class="tiny">🟪 F-01 · F-02 · F-03</p>')+'</div><aside>'+card('Detail kandidat '+c[0],'','<div class="tabs">'+['Komposisi & peran','Profil aroma','Analisis risiko','Metode & rencana uji','Dasar rekomendasi'].map(t=>'<button class="small '+(recommendTab===t?'active':'')+'" onclick="recommendTab=\''+t+'\';render()">'+t+'</button>').join('')+'</div><div class="row between"><div><small class="muted">Kode</small><h3>'+c[0]+'</h3></div><div><small class="muted">Skor total</small><h3>'+c[2]+'</h3></div><div><small class="muted">Aroma</small><h3>Citrus segar</h3></div></div>'+detail,badge(c[3],'green'))+'</aside></div>'}
function toggleCandidate(id){state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):[...state.selected,id];save();render()}function saveCandidates(){if(!state.selected.length){toast('Pilih minimal satu kandidat.');return}save();go('evaluasi');toast('Pilihan kandidat disimpan di browser ini.')}

teroksidasi menjadi asam dengan bau berbeda'],['Citronellol','C=C trisubstitusi (R-01)']]))+'</div><div>'+card('Profil deskriptor bau','Parfum awal dibanding campuran pengganti',['Citrus','Fresh','Lemon / lime','Sweet','Woody','Floral','Herbal'].map((t,i)=>'<div class="mt tiny"><strong>'+t+'</strong><div class="row"><span class="muted" style="width:74px">Limonene</span><div class="grow">'+progress([95,70,80,30,10,5,15][i],'#e4a51c')+'</div></div><div class="row"><span class="muted" style="width:74px">Campuran</span><div class="grow aroma-bar">'+progress([41,55,28,35,25,32,21][i])+'</div></div></div>').join('')+'<div class="note amber mt">Hasilnya <strong>mendekati</strong> profil target, bukan aroma yang sama. Skor kemiripan baru sah setelah uji panel.</div><button class="primary wide mt" onclick="toast(\'Campuran contoh dipilih untuk F-01\');activeCandidate=\'F-01\';go(\'rekomendasi\')">Gunakan di kandidat F-01</button>'+btn('Jadwalkan uji panel aroma','evaluasi','wide mt'))+'</div></div>'}

function trialTable(rows){return table(['Formulasi','Aroma','Dibuat','Diperbarui','Status','Progres','Hasil','Aksi'],rows.map(r=>{const last=state.results.filter(x=>x.candidate===r[0]&&!x.draft).at(-1);return ['<strong>'+r[0]+'</strong><p>'+r[1]+'</p>',badge(r[2]),r[3],last?esc(last.date):r[4],badge(r[5],statusColor(r[5])),progress(r[6],r[5]==='Sedang berjalan'?'#3173dd':r[5]==='Menunggu hasil'?'#e4a51c':r[5]==='Dihentikan'?'#da424a':'#21904e')+'<div class="tiny muted mt">'+r[6]/25+' / 4</div>',last?'Retensi '+last.retention.toFixed(1)+'% · '+esc(last.outcome):r[7],'<button class="small" onclick="activeCandidate=\''+r[0]+'\';go(\'input\')">'+(r[6]<100&&r[5]!=='Dihentikan'?'Input hasil':'Lihat detail')+'</button>']}))}
function filterTrials(){const q=$('#trial-search').value.toLowerCase(),selected=$('#trial-project').value==='Kandidat dipilih';let rows=trials.filter(r=>(trialFilter==='Semua'||r[5].startsWith(trialFilter))&&(!selected||state.selected.includes(r[0]))&&r.join(' ').toLowerCase().includes(q));if($('#trial-sort').value==='Kode formulasi')rows.sort((a,b)=>a[0].localeCompare(b[0]));$('#trial-table').innerHTML=rows.length?trialTable(rows):'<p class="muted" style="padding:28px;text-align:center">Tidak ada uji coba yang sesuai.</p>';$('#trial-count').textContent='Menampilkan '+rows.length+' dari '+trials.length+' formulasi'}

let experimentData={initial:'3.00',final:'2.91',phInitial:'3.6',phFinal:'3.7',clarity:'Jernih',notes:'',date:'2026-10-15',temperature:'40°C (dipercepat)',days:'5 hari'};

+'</div>';

if(experimentTab==='Uji antimikroba')return '<div class="note amber">Catat hasil pengujian laboratorium. Aroma bukan bukti efikasi antimikroba.</div><label class="field mt">Metode uji<input data-exp="method" placeholder="Metode sesuai standar LKPI" value="'+esc(experimentData.method||'')+'"></label><label class="field">Hasil dan organisme uji<textarea data-exp="microbe">'+esc(experimentData.microbe||'')+'</textarea></label>';
return '<label class="field">Catatan eksperimen<textarea data-exp="notes" style="min-height:200px">'+esc(experimentData.notes)+'</textarea></label>'}
function retentionValue(){const a=Number(experimentData.initial),b=Number(experimentData.final);return a>0&&Number.isFinite(b)?b/a*100:0}
function calcRetention(){captureExperiment();const r=retentionValue();$('#retention-result').textContent=Number(experimentData.initial)>0?r.toFixed(1)+'%'+(r>=90?' ✓':''):'Kadar awal harus > 0';$('#retention-result').parentElement.style.background=r>=90?'#e5f5ec':'#fff3dc'}
function switchExperiment(t){captureExperiment();experimentTab=t;$('#experiment-tabs').innerHTML=experimentTabs();$('#experiment-fields').innerHTML=experimentFields()}
function experimentTabs(){return ['Stabilitas kimia','Profil aroma','Karakteristik fisik','Uji antimikroba','Catatan'].map(t=>'<button class="'+(t===experimentTab?'active':'')+'" onclick="switchExperiment(\''+t+'\')">'+t+'</button>').join('')}
function experiment(){return head('Input Hasil Eksperimen','Catat hasil uji lab untuk kandidat terpilih. Data ini memperbarui evaluasi dan menjadi data latih model.','','evaluasi')+'<div class="grid mb experiment-summary" style="grid-template-columns:1fr 1.65fr 1fr"><section class="card" style="height:100%;background:#faf8ff"><p class="tiny">Kandidat yang dipilih</p><div class="row"><span class="value" style="font-size:36px">'+activeCandidate+'</span>'+badge('Terkunci')+'</div><p class="muted tiny">'+(trials.find(r=>r[0]===activeCandidate)?.[1]||candidates[0][1])+'. Komposisi dikunci agar hasil uji dapat dibandingkan antar iterasi.</p>'+badge('Tahap 3 dari 4 · accelerated stability','blue')+'</section>'+card('Komposisi formula','Rentang rekomendasi vs nilai sampel',table(['Bahan','Rentang (% w/w)','Nilai sampel'],comp(activeCandidate).map((r,i)=>[r[0],r[1],['3,0','2,0','0,4','0,1','pH 3,6','ad 100'][i]])))+card('Profil target','',radar(),badge('Citrus segar','amber'))+'</div><div class="grid split"><div>'+card('Input hasil uji coba','Hasil laboratorium untuk kandidat '+activeCandidate,'<div id="experiment-tabs" class="tabs">'+experimentTabs()+'</div><div id="experiment-fields">'+experimentFields()+'</div><button class="wide soft" onclick="extraParameter()">+ Tambah parameter kimia lain</button>','<label class="tiny">Tanggal uji <input id="test-date" type="date" value="'+esc(experimentData.date)+'"></label>')+'</div><aside class="stack">'+card('Panduan pengisian','','<p class="tiny">Gunakan metode uji yang konsisten dengan SOP lab LKPI.</p><p class="tiny">Catat kondisi penyimpanan (25°C, 40°C, atau uji dipercepat).</p><p class="tiny">Hasil gagal tetap dicatat, karena berguna sebagai data latih.</p>')+card('Kondisi penyimpanan','','<div id="conditions" class="form-grid"><label class="field">Suhu<select data-exp="temperature"><option>40°C (dipercepat)</option><option>25°C (suhu ruang)</option></select></label><label class="field">Lama simpan<select data-exp="days"><option>5 hari</option><option>2 hari</option><option>7 hari</option><option>14 hari</option></select></label>'+select('Kemasan',['Botol HDPE','Botol PET','Kaca'])+select('Paparan cahaya',['Tertutup','Terpapar cahaya'])+'</div>')+card('Riwayat hasil '+activeCandidate,'',table(['Tanggal','Kondisi','H₂O₂','pH','Status'],[...state.results.filter(x=>x.candidate===activeCandidate).map(x=>[esc(x.date),esc(x.temperature)+', '+esc(x.days),esc(x.final),esc(x.phFinal),badge(x.draft?'Draf':x.outcome,x.draft?'':x.retention>=90?'green':'amber')]),['15 Okt','40°C, 5 hari','2,91','3,7',badge('OK','green')],['12 Okt','40°C, 2 hari','2,97','3,6',badge('OK','green')],['10 Okt','Awal','3,00','3,6',badge('OK','green')]]))+card('Gunakan untuk pembelajaran model','','<label class="check"><input id="use-training" type="checkbox" checked> Tambahkan hasil ini ke dataset latih</label><p class="muted tiny">Akan menjadi data ke-'+(39+state.results.filter(x=>!x.draft).length)+'. Model dilatih ulang otomatis setiap 10 data baru pada sistem nyata.</p>'+btn('Lihat learning curve','model','wide small'))+'</aside></div><div class="foot"><button onclick="saveExperiment(true)">Simpan sebagai draf</button><button class="primary" onclick="saveExperiment(false)">Simpan dan perbarui evaluasi →</button></div>'}
function extraParameter(){modal('Parameter tambahan','<form onsubmit="event.preventDefault();experimentData.extra=$(\'#extra-name\').value+\': \'+$(\'#extra-value\').value;$(\'#modal\').close();toast(\'Parameter ditambahkan. Simpan hasil untuk menyimpan ke browser.\')">'+field('Nama parameter','','extra-name')+field('Nilai dan satuan','','extra-value')+'<button class="primary">Tambahkan</button></form>')}
function saveExperiment(draft){captureExperiment();const a=Number(experimentData.initial),b=Number(experimentData.final);if(!(a>0&&a<=100&&b>=0&&b<=100)){toast('Kadar awal harus lebih dari 0 dan kadar berada pada 0–100%.');return}if(![experimentData.phInitial,experimentData.phFinal].every(v=>Number.isFinite(Number(v))&&Number(v)>=0&&Number(v)<=14)){toast('pH harus berada pada rentang 0 sampai 14.');return}if(!experimentData.date){toast('Isi tanggal uji.');return}const r=retentionValue(),outcome=experimentData.clarity!=='Jernih'||r<80?'Tidak lolos':r>=90?'Sementara memenuhi':'Perlu tinjauan';state.results.push({...experimentData,candidate:activeCandidate,retention:r,outcome,draft,training:$('#use-training').checked&&!draft});save();toast(draft?'Draf tersimpan di browser.':'Hasil uji tersimpan dan evaluasi diperbarui.');if(!draft)go('evaluasi')}
function learning(){return head('Pembelajaran Model','Model dilatih ulang dari hasil uji yang dicatat formulator, termasuk yang gagal. Galat prediksi diharapkan menurun seiring bertambahnya data.','<button class="primary" onclick="trainDemo()">Latih ulang sekarang</button>')+'<div class="segmented">'+btn('Daftar uji coba','evaluasi')+btn('Pembelajaran model','model','active')+'</div>'+stats([[(38+state.results.filter(x=>x.training).length)+' / 60'+progress(Math.min(100,(38+state.results.filter(x=>x.training).length)/60*100),'',true),'Minimum untuk mode prediksi: [60] data'],[state.version,'Versi model aktif · Dilatih 14 Okt 2026'],['2 data lagi','Latih ulang berikutnya · otomatis setiap 10 data baru'],[badge('Mode evaluasi','amber'),'Prediksi ditampilkan sebagai pendukung, bukan keputusan']])+'<div class="grid split"><div class="stack">'+card('Learning curve','Galat validasi silang terhadap jumlah data eksperimen','<div id="learning-chart">'+curve(true)+'</div><div class="note amber mt">Kurva ini ilustrasi tampilan. Nilai galat nyata muncul setelah data eksperimen LKPI tersedia, dan target akurasi ditetapkan setelah data memadai.</div>','<div class="segmented"><button class="active" onclick="modelChart(this,0)">CatBoost</button><button onclick="modelChart(this,1)">XGBoost</button></div>')+card('Riwayat pelatihan ulang','',table(['Versi','Tanggal','Data latih','Galat vs versi sebelumnya','Catatan'],[['v0.4','14 Okt 2026','38',badge('↓ turun','green'),'Ditambah hasil F-04 dan F-05 yang gagal'],['v0.3','8 Okt 2026','28',badge('↓ turun','green'),'Data deskriptor bau Pyrfume ditambahkan'],['v0.2','1 Okt 2026','18',badge('≈ sama',''),'Data literatur dan SDS'],['v0.1','24 Sep 2026','10',badge('baseline',''),'Model awal']])+'<p class="tiny mt">Faktor paling berpengaruh pada prediksi retensi H₂O₂ (ilustrasi)</p>'+['pH formula','Chelating agent (HEDP)','Jumlah C=C pada parfum','Jenis surfaktan','Suhu penyimpanan'].map((t,i)=>'<div class="row tiny" style="margin:10px 0"><span style="width:200px">'+t+'</span><div class="grow">'+progress([88,70,62,40,35][i])+'</div></div>').join(''))+'</div><aside class="stack">'+card('Model dalam sistem','',[['MolFormer','Representasi struktur molekul (embedding). Model pralatih, tidak dilatih ulang.','Aktif'],['CatBoost','Prediksi retensi H₂O₂ setelah penyimpanan.','Evaluasi'],['XGBoost','Prediksi stabilitas fisik dan ketahanan aroma.','Evaluasi'],['Bayesian Optimization','Mengusulkan komposisi uji berikutnya yang paling informatif.','Aktif']].map(([n,d,s])=>'<div class="list-item"><span class="num">'+n[0]+'</span><div class="grow"><strong>'+n+'</strong><p>'+d+'</p></div>'+badge(s,s==='Aktif'?'green':'amber')+'</div>').join(''))+card('Usulan uji berikutnya','',table(['Bahan','Nilai'],[['Hydrogen Peroxide','3,0 %'],['Alcohol Ethoxylate (S-01)','1,8 %'],['Campuran aroma rekonstruksi','0,45 %'],['HEDP','0,15 %'],['pH target','3,9']])+'<p class="muted tiny"><strong>Alasan:</strong> wilayah pH 3,8–4,0 dengan dosis aroma lebih tinggi belum pernah diuji, sehingga hasilnya paling banyak menambah informasi bagi model.</p><button class="primary wide" onclick="newTrial()">Jadikan kandidat uji</button>'+btn('Diskusikan di Chat AI','chat','wide mt'),badge('Bayesian Optimization'))+'</aside></div>'}
function modelChart(b,n){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#learning-chart').innerHTML=curve(true)+(n?'<p class="muted tiny">XGBoost · Kurva contoh untuk stabilitas fisik dan aroma.</p>':'')}

function importSDS(){modal('Impor SDS','<p class="muted tiny">Pilih dokumen SDS untuk melihat metadata berkas. Ekstraksi bahan dari PDF belum terhubung.</p><input type="file" accept=".pdf" onchange="document.getElementById(\'sds-info\').textContent=this.files[0]?this.files[0].name+\' · \'+Math.round(this.files[0].size/1024)+\' KB · dipilih secara lokal\':\'\'"><p id="sds-info" class="tiny"></p>')}
function pickLibrary(){modal('Pilih bahan dari Library','<div class="stack">'+materials.slice(0,10).map((r,i)=>'<button class="row between" onclick="insertMaterial('+i+')"><span>'+r[0]+'</span>'+badge(r[1],'')+'</button>').join('')+'</div>')}
function insertMaterial(i){const r=materials[i];$('#ingredients').insertAdjacentHTML('beforeend',ingredient(r[0],'CAS '+r[2]+' · '+r[1],'0.1',$('#ingredients').children.length+1));$('#modal').close()}
let messages=[{role:'user',text:'Kenapa kadar H₂O₂ pada F-03 turun lebih cepat dibanding F-01?'},{role:'ai',text:'Ada dua penyebab yang paling mungkin pada data contoh.\n1. F-03 masih memakai limonene yang ikatan C=C-nya kontak langsung dengan H₂O₂, sehingga sebagian H₂O₂ terpakai untuk mengoksidasi parfum. F-01 memakai campuran pengganti dengan gugus rentan yang lebih sedikit.\n2. F-03 tidak memakai chelating agent, sedangkan F-01 memakai HEDP yang mengikat logam jejak pemicu penguraian H₂O₂.\nHipotesis ini perlu diverifikasi melalui uji terkontrol dan tinjauan ahli kimia.'}];
function messageHTML(){return messages.map(m=>'<div class="message '+m.role+'">'+(m.role==='ai'?'<div class="row tiny"><span class="avatar" style="width:28px;height:28px">AI</span><strong>BAYLab AI</strong>'+badge('Simulasi','')+'</div><p>':'')+esc(m.text)+(m.role==='ai'?'</p><div class="tiny">'+badge('1 Uji F-03','')+' '+badge('2 Uji F-01','')+' '+badge('3 Screening R-01','')+' '+badge('4 Literatur','')+'</div>':'')+'</div>').join('')}
function chat(){return head('Chat with AI','Diskusikan hasil simulasi dan eksperimen. Jawaban merujuk data proyek dan literatur yang tersimpan (RAG).','<button class="primary" onclick="messages=[];render()">+ Percakapan baru</button>')+'<div class="chat-layout"><aside class="card chat-sidebar"><div class="tiny">Percakapan</div>'+['Penurunan H₂O₂ pada F-03','Campuran pengganti limonene','Pilihan chelating agent','Kenapa F-04 dihentikan'].map(t=>'<button onclick="askChat(\''+t+'\')">'+t+'</button>').join('')+'</aside><section class="card chat-main"><div class="tiny muted">Konteks aktif: '+badge('PRJ-01')+' '+badge('Screening R-01')+' '+badge('Kandidat F-01 · F-03')+' '+badge('Uji 15 Okt')+'</div><div id="messages" class="messages">'+messageHTML()+'</div><div class="suggestions">'+['Bandingkan F-01 dan F-02 untuk ruang rawat','Apa risiko dihydromyrcenol?','Rangkum hasil uji minggu ini'].map(t=>'<button class="small" onclick="askChat(\''+t+'\')">'+t+'</button>').join('')+'</div><form class="row mt" onsubmit="event.preventDefault();askChat($(\'#chat-input\').value)"><input id="chat-input" placeholder="Tanyakan tentang hasil simulasi atau eksperimen..." aria-label="Pesan" required><button class="primary">Kirim</button></form><p class="muted tiny">Jawaban AI adalah contoh simulasi, bukan layanan AI terhubung. Keputusan formula tetap ditinjau formulator dan ahli kimia.</p></section><aside class="stack">'+card('Terhubung ke modul','',['Knowledge Screening','Formulation Analysis & Recommendation','Experiment Tracking','Library Bahan'].map((t,i)=>'<p class="tiny"><span class="dot"></span><a style="color:var(--ink)" href="#'+['screening','rekomendasi','evaluasi','library'][i]+'">'+t+'</a></p>').join(''))+card('Sumber jawaban terakhir','',['Data uji F-03, 13 Okt 2026 (internal)','Data uji F-01, 15 Okt 2026 (internal)','Hasil screening R-01 dan R-04','[Contoh] Artikel tentang oksidasi limonene oleh H₂O₂'].map((t,i)=>'<div class="row tiny mt">'+badge(i+1)+'<span>'+t+'</span></div>').join(''))+'</aside></div>'}
function askChat(q){q=q.trim();if(!q)return;let a='Prototipe ini hanya menyediakan jawaban contoh dari rancangan BAYLab AI. Pertanyaan tersebut belum dapat dijawab dengan sumber terverifikasi. Tinjau halaman screening, rekomendasi, atau hasil eksperimen; layanan RAG belum terhubung.';if(/F-03|penurunan|turun/i.test(q))a='Dalam data contoh, F-03 menggunakan limonene dengan gugus C=C dan belum menggunakan HEDP. F-01 menggunakan campuran aroma rekonstruksi serta HEDP. Perbedaan ini merupakan hipotesis penyebab penurunan kadar, bukan kesimpulan eksperimen.';else if(/bandingkan|F-02/i.test(q))a='F-01: campuran aroma citrus rekonstruksi + chelating agent, skor ilustratif 0,84.\nF-02: limonene terenkapsulasi β-siklodekstrin, skor ilustratif 0,78.\nPilihan perlu didukung hasil uji stabilitas, panel aroma, dan efikasi.';else if(/dihydro|pengganti|limonene/i.test(q))a='Pada desain, campuran rekonstruksi terdiri dari 5 senyawa. Dihydromyrcenol dan tricyclodecenyl propionate masih ditandai R-01 karena C=C. Skor kemiripan contoh 0,72 bukan bukti kemiripan aroma; perlu uji panel.';else if(/HEDP|chelating/i.test(q))a='HEDP muncul pada kandidat F-01 dan F-02 sebagai chelating agent. Perannya dalam rancangan adalah mengikat logam jejak. Komposisi contoh belum merupakan formula tervalidasi.';else if(/F-04/i.test(q))a='Pada data contoh, F-04 (linalool, floral) dihentikan karena aroma berubah setelah satu minggu. Hasil gagal tetap dicatat untuk evaluasi berikutnya.';else if(/rangkum|minggu/i.test(q))a='Data contoh: F-01 dan F-02 sedang berjalan, F-03 menunggu hasil, F-04 dihentikan, F-05 dan F-06 selesai evaluasi.\nHasil tambahan yang tersimpan di browser: '+state.results.filter(r=>!r.draft).length+' catatan.';messages.push({role:'user',text:q},{role:'ai',text:a});$('#messages').innerHTML=messageHTML();$('#chat-input').value='';$('#messages').lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'})}
const settingTabs=['Parameter mutu LKPI','Bobot kriteria','Model AI','Sumber data','Pengguna dan akses'];
const parameterRows=[['Retensi H₂O₂ setelah accelerated stability','≥ [90] %','Titrasi','Asumsi tim'],['Rentang pH','[3,0–4,5]','pH meter','Asumsi tim'],['Homogenitas dan pemisahan fase','Tidak ada','Visual','Brief LKPI'],['Intensitas aroma saat disemprot (panel 0–5)','≥ [3]','Organoleptik','Asumsi tim'],['Lama aroma tercium','15–30 menit','Organoleptik','Asumsi tim'],['Efikasi antimikroba','[standar LKPI]','SNI EN 13727','Menunggu LKPI']];
function settingsBody(){if(settingTab==='Parameter mutu LKPI')return card(settingTab,'Menjadi ambang lulus di Rekomendasi dan Evaluasi Uji Coba. Nilai dalam kurung siku menunggu standar mutu resmi dari LKPI.',table(['Parameter','Ambang lulus','Metode','Sumber nilai'],parameterRows.map((r,i)=>[r[0],'<input data-setting="param'+i+'" aria-label="'+r[0]+'" value="'+esc(state.settings['param'+i]??r[1])+'">',r[2],badge(r[3],r[3]==='Asumsi tim'?'amber':r[3]==='Brief LKPI'?'green':'')])));if(settingTab==='Bobot kriteria')return card(settingTab,'Bobot tersimpan sebagai konfigurasi prototipe. Ranking contoh tidak dihitung ulang.',table(['Kriteria','Bobot (%)'],['Kompatibilitas','Stabilitas','Profil aroma','Keamanan','Feasibility'].map((t,i)=>[t,'<input data-setting="weight'+i+'" type="number" min="0" max="100" aria-label="Bobot '+t+'" value="'+esc(state.settings['weight'+i]??[25,25,20,20,10][i])+'">'])));if(settingTab==='Model AI')return card(settingTab,'Konfigurasi pembelajaran dari eksperimen.',['MolFormer','CatBoost','XGBoost','Bayesian Optimization'].map(t=>'<div class="list-item"><span class="num">'+t[0]+'</span><div class="grow"><strong>'+t+'</strong><p>Belum terhubung pada prototipe lokal</p></div>'+badge('Simulasi','amber')+'</div>').join(''));if(settingTab==='Sumber data')return card(settingTab,'Sumber yang direncanakan dalam proposal.',table(['Sumber','Kegunaan','Status'],[['PubChem','Struktur dan identitas bahan',badge('Belum terhubung','amber')],['Pyrfume','Deskriptor aroma',badge('Belum terhubung','amber')],['IFRA','Standar bahan aroma',badge('Belum terhubung','amber')],['SDS internal LKPI','Data bahan',badge('Impor lokal','')]]));return card(settingTab,'Akses dalam prototipe hanya menggunakan akun demo.',table(['Nama','Peran','Status'],[['Dewi','Formulator R&D',badge('Akun demo','green')]]))}
function settings(){return head('Pengaturan','Atur ambang mutu LKPI, bobot kriteria rekomendasi, model AI, sumber data, dan akses pengguna.','<button class="primary" onclick="saveSettings()">Simpan perubahan</button>')+'<div class="settings-layout"><aside class="card settings-menu">'+settingTabs.map(t=>'<button class="'+(settingTab===t?'active':'')+'" onclick="captureSettings();settingTab=\''+t+'\';render()">'+t+'</button>').join('')+'</aside><div id="settings-body">'+settingsBody()+'</div></div>'}
function captureSettings(){document.querySelectorAll('[data-setting]').forEach(el=>state.settings[el.dataset.setting]=el.value)}
function saveSettings(){captureSettings();if(settingTab==='Bobot kriteria'){const sum=[0,1,2,3,4].reduce((s,i)=>s+Number(state.settings['weight'+i]??[25,25,20,20,10][i]),0);if(Math.abs(sum-100)>.001){toast('Total bobot harus 100%. Saat ini '+sum+'%.');return}}if(save())toast('Pengaturan disimpan di browser ini.')}
const views={login,dashboard,formulasi:formulation,screening,literatur:literature,rekomendasi:recommendations,aroma,evaluasi:evaluation,input:experiment,model:learning,chat,library,pengaturan:settings};
function render(){const r=route(),v=views[r]||dashboard;document.title=(navs.find(x=>x[0]===r)?.[1]||({login:'Masuk',literatur:'Analisis Literatur',aroma:'Rekonstruksi Aroma',input:'Input Hasil Eksperimen',model:'Pembelajaran Model'}[r])||'BAYLab AI')+' · BAYLab AI';$('#app').innerHTML=r==='login'?login():shell(v());if(r==='formulasi'){if(state.draft.ingredientRows)$('#ingredients').innerHTML=state.draft.ingredientRows.map((x,i)=>ingredient(esc(x.name),esc(x.description),esc(x.value),i+1)).join('');if(state.draft.aromas)document.querySelectorAll('.aromas button').forEach(el=>{const selected=state.draft.aromas.includes(el.textContent.trim());el.classList.toggle('selected',selected);el.setAttribute('aria-pressed',selected)});document.querySelectorAll('#formula [name]').forEach(el=>{if(state.draft[el.name]!=null)el.value=state.draft[el.name]})}if(r==='dashboard'){document.querySelector('.dashboard .stats .stat:last-child').innerHTML='<div class="tiny">Data eksperimen untuk model</div><div><strong style="font-size:19px">'+(38+state.results.filter(x=>x.training).length)+' / 60</strong>'+progress(Math.min(100,(38+state.results.filter(x=>x.training).length)/60*100),'',true)+'</div><p>Model masih mode evaluasi sampai data minimum terpenuhi</p>'}if(r==='library')filterLibrary();if(r==='evaluasi')filterTrials();if(r==='input')document.querySelectorAll('[data-exp]').forEach(el=>{if(experimentData[el.dataset.exp]!=null)el.value=experimentData[el.dataset.exp]});window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{if($('#modal').open)$('#modal').close();render()});render();
</script></body></html>
